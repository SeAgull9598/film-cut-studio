    if (mdShortcut(b, c)) return;          // Markdown 命中后已重建该块
    if (slash) updateSlash();
    commitSoon();
  }

  /** Markdown 行首快捷输入 */
  function mdShortcut(b, c) {
    if (b.type !== 'text') return false;
    const txt = c.textContent || '';
    if (txt === '---' || txt === '***') { toDivider(b); return true; }
    for (let i = 0; i < MD.length; i++) {
      const m = txt.match(MD[i][0]);
      if (m) { changeType(b, MD[i][1], txt.slice(m[0].length)); return true; }
    }
    return false;
  }

  /** 换类型；rawText 传入时用纯文本覆盖内容（Markdown / 斜杠命令场景） */
  function changeType(b, type, rawText) {
    LP.state.push();
    b.type = type;
    if (rawText != null) b.content = U.esc(rawText);
    if (type === 'voice') b.content = b.content || '';
    commit('切换块类型');
    const node = replaceNode(b);
    const c = node ? node.querySelector('.blk-c') : null;
    if (c) setCaret(c, rawText != null ? rawText.length : (c.textContent || '').length);
  }

  function toDivider(b) {
    LP.state.push();
    b.type = 'divider'; b.content = '';
    const nb = LP.model.newBlock('text', '');
    cur.owner.blocks.splice(idxOf(b) + 1, 0, nb);
    commit('插入分隔线');
    paint();
    focusBlock(nb.id, 'start');
  }

  function replaceNode(b) {
    const old = nodeOf(b.id);
    if (!old) { paint(); return nodeOf(b.id); }
    const fresh = buildBlock(b);
    old.parentNode.replaceChild(fresh, old);
    return fresh;
  }

  function focusBlock(id, where) {
    const n = nodeOf(id);
    const c = n ? n.querySelector('.blk-c') : null;
    if (!c) return false;
    setCaret(c, where === 'start' ? 0 : (c.textContent || '').length);
    return true;
  }

  /* ====================================================== 键盘 */
  /* 这些键在编辑器内不应冒泡给全局快捷键；Escape 只在斜杠菜单打开时拦截 */
  const STOP_KEYS = { Enter: 1, Backspace: 1, Delete: 1, ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1, Home: 1, End: 1, Tab: 1 };

  function onDocKeydown(e) {
    const c = e.target && e.target.closest ? e.target.closest('.blk-c') : null;
    if (!c || !cur.container || !cur.container.contains(c)) return;
    const b = blockOfNode(c);
    if (!b) return;
    onKeydown(e, b, c);
  }

  function onKeydown(e, b, c) {
    /* 编辑器内的按键不应触发全局快捷键（空格播放 / Del 删片段 / ⌘B 拆分…） */
    if (STOP_KEYS[e.key] || (e.key.length === 1 && !e.metaKey && !e.ctrlKey)) e.stopPropagation();
    /* 输入法合成中（选字、回车确认候选）一律放行，否则会误建块 */
    if (e.isComposing || e.keyCode === 229 || composing) return;

    if (slash && slashKey(e)) return;

    const mod = e.metaKey || e.ctrlKey;
    if (mod && !e.altKey && e.key.length === 1) {
      const k = e.key.toLowerCase();
      if (k === 'b') { e.preventDefault(); e.stopPropagation(); fmt('bold'); return; }
      if (k === 'i') { e.preventDefault(); e.stopPropagation(); fmt('italic'); return; }
      if (k === 'h') { e.preventDefault(); e.stopPropagation(); fmt('mark'); return; }
      if (k === 'e') { e.preventDefault(); e.stopPropagation(); fmt('code'); return; }
      return;
    }

    if (e.key === '/') { setTimeout(() => openSlash(b, c), 0); return; }

    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); onEnter(b, c); return; }
    if (e.key === 'Enter' && e.shiftKey) {
      e.preventDefault();
      document.execCommand('insertLineBreak');
      b.content = sanitize(c.innerHTML); commitSoon();
      return;
    }
    if (e.key === 'Backspace' && collapsed() && caretOffset(c) === 0) { e.preventDefault(); onBackspace(b, c); return; }
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      const up = e.key === 'ArrowUp';
      if (!edgeLine(c, up)) return;
      const sib = siblingEditable(b, up);
      if (sib) { e.preventDefault(); setCaret(sib, up ? (sib.textContent || '').length : 0); }
    }
  }

  function edgeLine(c, up) {
    const cr = caretRect();
    if (!cr) return true;
    const er = c.getBoundingClientRect();
    return up ? (cr.top - er.top < 6) : (er.bottom - cr.bottom < 6);
  }
  function siblingEditable(b, up) {
    const arr = blocks();
    let i = arr.indexOf(b);
    if (i < 0) return null;
    for (i += up ? -1 : 1; i >= 0 && i < arr.length; i += up ? -1 : 1) {
      const n = nodeOf(arr[i].id);
      const c = n ? n.querySelector('.blk-c') : null;
      if (c) return c;
    }
    return null;
  }

  /** Enter：在块末尾新建下一块；在中间则拆分 */
  function onEnter(b, c) {
    const arr = cur.owner.blocks;
    const txt = c.textContent || '';
    /* 空的列表 / 待办按 Enter 退回普通文本（Notion 行为） */
    if (!txt && (b.type === 'list' || b.type === 'todo')) { changeType(b, 'text', ''); return; }

    const off = caretOffset(c);
    let tail = '';
    if (off < txt.length) {
      const r = rangeOfOffsets(c, off, txt.length);
      const tmp = document.createElement('div');
      tmp.appendChild(r.extractContents());
      tail = sanitize(tmp.innerHTML);
    }
    LP.state.push();
    b.content = sanitize(c.innerHTML);
    const keep = { list: 1, todo: 1, quote: 1, callout: 1 };
    const nb = LP.model.newBlock(keep[b.type] ? b.type : 'text', tail);
    arr.splice(idxOf(b) + 1, 0, nb);
    commit('新建块');

    const host = nodeOf(b.id);
    const fresh = buildBlock(nb);
    if (host && host.parentNode) host.parentNode.insertBefore(fresh, host.nextSibling);
    else paint();
    focusBlock(nb.id, 'start');
  }

  /** Backspace 在块首：非文本块先降级为文本；空块删除并聚焦上一块末尾；有内容则并入上一块 */
  function onBackspace(b, c) {
    const arr = cur.owner.blocks, i = idxOf(b);
    if (b.type === 'voice') return;                       // 语音块只能用 ✕ 删除，避免误删音频
    if (b.type !== 'text') {                              // 先降级成普通文本，保留行内格式
      LP.state.push();
      b.type = 'text';
      commit('切换块类型');
      const node = replaceNode(b);
      const nc = node ? node.querySelector('.blk-c') : null;
      if (nc) setCaret(nc, 0);
      return;
    }
    if (i <= 0) return;

    const prev = arr[i - 1];
    if (prev.type === 'divider') {                        // 直接吃掉上面的分隔线
      LP.state.push();
      arr.splice(i - 1, 1);
      commit('删除分隔线');
      const pn = nodeOf(prev.id); if (pn) pn.remove();
      setCaret(c, 0);
      return;
    }
    const pn = nodeOf(prev.id);
    const pc = pn ? pn.querySelector('.blk-c') : null;
    if (!pc || prev.type === 'voice') {
      if (!(c.textContent || '')) { removeBlock(b, true); focusBlock(prev.id, 'end'); }
      return;
    }
    const off = (pc.textContent || '').length;
    LP.state.push();
    prev.content = sanitize((pc.innerHTML || '') + (c.innerHTML || ''));
    arr.splice(i, 1);
    commit('合并块');
    pc.innerHTML = sanitize(prev.content);
    const n = nodeOf(b.id); if (n) n.remove();
    setCaret(pc, off);
  }

  /* ====================================================== 增删 */
  function addBlock(type, after) {
    if (!cur.owner) return U.toast('先选中一个镜头或段落组', 'err');
    const arr = cur.owner.blocks;
    LP.state.push();
    const nb = LP.model.newBlock(type, '');
    const at = after ? idxOf(after) + 1 : arr.length;
    arr.splice(at, 0, nb);
    commit('新建块');
    paint();
    if (!focusBlock(nb.id, 'end')) {
      const n = nodeOf(nb.id); if (n) n.scrollIntoView({ block: 'nearest' });
    }
  }

  function removeBlock(b, quiet) {
    const arr = cur.owner ? cur.owner.blocks : null;
    if (!arr) return;
    const i = arr.indexOf(b);
    if (i < 0) return;
    if (rec && rec.blockId === b.id) stopRec(true);
    if (b.audioRef) { try { LP.storage.delBlob(b.audioRef); } catch (e) { } }   // 连音频一起清掉
    LP.state.push();
    arr.splice(i, 1);
    if (!arr.length) arr.push(LP.model.newBlock('text', ''));
    commit('删除块');
    const focusId = arr[Math.max(0, i - 1)] ? arr[Math.max(0, i - 1)].id : null;
    paint();
    if (!quiet && focusId) focusBlock(focusId, 'end');
  }

  /* ====================================================== 拖拽排序 R-019 */
  function bindDrag(node, b, handle) {
    handle.addEventListener('dragstart', e => {
      dragId = b.id;
      node.style.opacity = '.45';
      try {
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', b.id);
        e.dataTransfer.setDragImage(node, 12, 10);
      } catch (err) { }
    });
    handle.addEventListener('dragend', () => {
      dragId = null; node.style.opacity = ''; clearMarks();
    });
    node.addEventListener('dragover', e => {
      if (!dragId || dragId === b.id) return;
      e.preventDefault();
      const r = node.getBoundingClientRect();
      const before = (e.clientY - r.top) < r.height / 2;
      clearMarks();
      node.style.boxShadow = before ? 'inset 0 2px 0 var(--accent)' : 'inset 0 -2px 0 var(--accent)';
      node.setAttribute('data-drop', before ? 'before' : 'after');
    });
    node.addEventListener('dragleave', () => {
      node.style.boxShadow = ''; node.removeAttribute('data-drop');
    });
    node.addEventListener('drop', e => {
      e.preventDefault();
      const where = node.getAttribute('data-drop') || 'before';
      clearMarks();
      moveBlock(dragId, b.id, where === 'after');
      dragId = null;
    });
  }
  function clearMarks() {
    if (!cur.container) return;
    U.$$('.blk[data-drop]', cur.container).forEach(n => { n.style.boxShadow = ''; n.removeAttribute('data-drop'); });
  }
  function moveBlock(fromId, toId, after) {
    if (!fromId || fromId === toId || !cur.owner) return;
    const arr = cur.owner.blocks;
    const fi = arr.findIndex(x => x.id === fromId);
    if (fi < 0) return;
    LP.state.push();
    const item = arr.splice(fi, 1)[0];
    let ti = arr.findIndex(x => x.id === toId);
    if (ti < 0) ti = arr.length - 1;
    arr.splice(after ? ti + 1 : ti, 0, item);
    commit('调整块顺序');
    paint();
  }

  /* ====================================================== 行内格式 R-019 */
  function fmt(kind) {
    if (kind === 'bold' || kind === 'italic') {
      /* 关掉 styleWithCSS，让加粗/斜体产出 <b>/<i> 标签而不是 style（style 会被 sanitize 剥掉） */
      try { document.execCommand('styleWithCSS', false, false); } catch (e) { }
      try { document.execCommand(kind); } catch (e) { }
    } else {
      wrapToggle(kind === 'mark' ? 'mark' : 'code');
    }
    const c = document.activeElement;
    if (c && c.classList && c.classList.contains('blk-c')) {
      const b = blockOfNode(c);
      if (b) { b.content = sanitize(c.innerHTML); commitSoon(); }
    }
  }
  function wrapToggle(tag) {
    const s = window.getSelection();
    if (!s || !s.rangeCount) return;
    const r = s.getRangeAt(0);
    const host = closestC(r.commonAncestorContainer);
    if (!host) return;
    const hit = closestTag(r.commonAncestorContainer, tag, host);
    if (hit) {                                  // 已在标签内 → 取消格式
      const p = hit.parentNode;
      while (hit.firstChild) p.insertBefore(hit.firstChild, hit);
      p.removeChild(hit); p.normalize();
      return;
    }
    if (r.collapsed) { U.toast('先选中要格式化的文字'); return; }
    const w = document.createElement(tag);
    try { w.appendChild(r.extractContents()); r.insertNode(w); } catch (e) { return; }
    const nr = document.createRange();
    nr.selectNodeContents(w);
    s.removeAllRanges(); s.addRange(nr);
  }
  function closestC(n) {
    while (n) {
      if (n.nodeType === 1 && n.classList && n.classList.contains('blk-c')) return n;
      n = n.parentNode;
    }
    return null;
  }
  function closestTag(n, tag, stop) {
    tag = tag.toUpperCase();
    while (n && n !== stop) {
      if (n.nodeType === 1 && n.tagName === tag) return n;
      n = n.parentNode;
    }
    return null;
  }

  /* ====================================================== 斜杠命令菜单 R-019 */
  function openSlash(b, c) {
    closeSlash();
    if (!c.isConnected) return;
    const pos = caretOffset(c) - 1;
    if (pos < 0 || (c.textContent || '').charAt(pos) !== '/') return;
    const menu = el('div', { class: 'slash-menu' });
    document.body.appendChild(menu);
    slash = { blockId: b.id, c: c, pos: pos, menu: menu, items: [], idx: 0 };
    updateSlash();
  }
  function closeSlash() {
    if (slash && slash.menu && slash.menu.parentNode) slash.menu.parentNode.removeChild(slash.menu);
    slash = null;
  }
  function updateSlash() {
    if (!slash) return;
    const c = slash.c;
    if (!c.isConnected) return closeSlash();
    const txt = c.textContent || '';
    const co = caretOffset(c);
    if (co <= slash.pos || txt.charAt(slash.pos) !== '/') return closeSlash();
    const q = txt.slice(slash.pos + 1, co);
    if (/\s/.test(q)) return closeSlash();
    const items = TYPES.concat(CMDS).filter(it => match(it, q.toLowerCase()));
    if (!items.length) return closeSlash();
    slash.items = items;
    if (slash.idx >= items.length) slash.idx = 0;
    paintSlash();
  }
  function match(it, q) {
    if (!q) return true;
    const hay = (it.name + ' ' + it.desc + ' ' + it.kw).toLowerCase();
    if (hay.indexOf(q) >= 0) return true;
    let i = 0;                                   // 模糊：子序列匹配（bt → biaoti）
    for (let k = 0; k < hay.length && i < q.length; k++) if (hay.charAt(k) === q.charAt(i)) i++;
    return i >= q.length;
  }
  function paintSlash() {
    const m = slash.menu;
    m.innerHTML = '';
    slash.items.forEach((it, i) => {
      const row = el('div', { class: 'slash-item' + (i === slash.idx ? ' on' : '') }, [
        el('span', { class: 'si-ic', text: it.ic }),
        el('span', { text: it.name }),
        el('span', { class: 'si-d', text: it.desc })
      ]);
      row.addEventListener('mousedown', e => { e.preventDefault(); applySlash(it); });
      m.appendChild(row);
    });
    const act = m.children[slash.idx];
    if (act && act.scrollIntoView) act.scrollIntoView({ block: 'nearest' });
    const r = caretRect();
    const w = 210, h = Math.min(280, m.scrollHeight || 200);
    let x = r ? r.left : 240, y = r ? r.bottom + 4 : 200;
    x = Math.max(8, Math.min(x, window.innerWidth - w - 8));
    if (y + h > window.innerHeight - 8) y = Math.max(8, (r ? r.top : y) - h - 4);
    m.style.left = x + 'px';
    m.style.top = y + 'px';
  }
  function slashKey(e) {
    const k = e.key;
    if (k === 'Escape') { e.preventDefault(); e.stopPropagation(); closeSlash(); return true; }
    if (k === 'ArrowDown' || k === 'ArrowUp') {
      e.preventDefault(); e.stopPropagation();
      const n = slash.items.length;
      slash.idx = (slash.idx + (k === 'ArrowDown' ? 1 : -1) + n) % n;
      paintSlash();
      return true;
    }
    if (k === 'Enter' || k === 'Tab') {
      e.preventDefault(); e.stopPropagation();
      applySlash(slash.items[slash.idx]);
      return true;
    }
    return false;
  }
  function applySlash(it) {
    if (!slash || !it) return;
    const c = slash.c, pos = slash.pos;
    const b = blocks().find(x => x.id === slash.blockId);
    closeSlash();
    if (!b || !c.isConnected) return;
    /* 抹掉 "/query" 这段文字 */
    const co = caretOffset(c);
    if (co > pos) {
      const r = rangeOfOffsets(c, pos, co);
      r.deleteContents();
    }
    b.content = sanitize(c.innerHTML);
    setCaret(c, pos);

    if (it.cmd === 'tc') { insertTC(); return; }
    if (it.cmd === 'digest') { digest(); return; }
    if (it.type === 'divider') { toDivider(b); return; }
    if (it.type === 'voice') { toVoice(b); return; }
    if (it.type === b.type) { commitSoon(); return; }

    LP.state.push();
    b.type = it.type;
    commit('切换块类型');
    const node = replaceNode(b);
    const nc = node ? node.querySelector('.blk-c') : null;
    if (nc) setCaret(nc, pos);
  }
  function toVoice(b) {
    const arr = cur.owner.blocks;
    LP.state.push();
    let target = b;
    if (b.type === 'text' && !plain(b.content)) { b.type = 'voice'; b.content = ''; }
    else { target = LP.model.newBlock('voice', ''); arr.splice(idxOf(b) + 1, 0, target); }
    commit('插入语音块');
    paint();
    const n = nodeOf(target.id);
    if (n && n.scrollIntoView) n.scrollIntoView({ block: 'nearest' });
  }

  /* ====================================================== 时间码 R-021 */
  function insertTC() {
    if (!cur.owner) return U.toast('先选中一个镜头或段落组', 'err');
    const t = nowTime();
    const html = '<span class="tcref chip dim" data-t="' + t.toFixed(3) + '">[' + U.tc(t) + ']</span>&nbsp;';
    let c = document.activeElement;
    if (!(c && c.classList && c.classList.contains('blk-c') && cur.container.contains(c))) c = lastC;
    if (!c || !c.isConnected || !cur.container.contains(c)) {
      LP.state.push();
      const nb = LP.model.newBlock('text', html);
      cur.owner.blocks.push(nb);
      commit('插入时间码');
      paint();
      focusBlock(nb.id, 'end');
    } else {
      c.focus();
      document.execCommand('insertHTML', false, html);
      const b = blockOfNode(c);
      if (b) { b.content = sanitize(c.innerHTML); commitSoon(); }
    }
    U.toast('已插入时间码 ' + U.tc(t));
  }
  function onDocClick(e) {
    const tgt = e.target;
    if (slash && slash.menu && !slash.menu.contains(tgt)) closeSlash();
    const ref = tgt && tgt.closest ? tgt.closest('.tcref') : null;
    if (!ref || !cur.container || !cur.container.contains(ref)) return;
    const t = parseFloat(ref.getAttribute('data-t'));
    if (!isFinite(t)) return;
    if (seekTo(t)) U.toast('跳到 ' + U.tc(t));
  }

  /* ====================================================== 摘要回填 R-021 */
  /* 「块=论证，字段=结论」：把第一段纯文本写回结论字段 */
  function digest() {
    const o = cur.owner;
    if (!o) return U.toast('先选中一个镜头或段落组', 'err');
    let text = '';
    const arr = o.blocks || [];
    for (let i = 0; i < arr.length; i++) {
      if (arr[i].type === 'divider') continue;
      const s = plain(arr[i].content) || (arr[i].transcript || '').trim();
      if (s) { text = s; break; }
    }
    if (!text) return U.toast('还没有可回填的文字', 'err');
    const key = cur.kind === 'group' ? 'analysis' : 'sevenQ';
    const name = cur.kind === 'group' ? '段落组分析' : '七问分析';
    if ((o[key] || '').trim()) return U.toast(name + '已有内容，未覆盖', 'err');
    LP.state.push();
    o[key] = text;
    commit('摘要回填');
    U.toast('已回填到「' + name + '」', 'ok');
  }

  /* ====================================================== 语音块 R-020 */
  function buildVoice(b) {
    /* .blk 是横向 flex，语音块需要纵向排布，这里用一个最小内联样式包一层 */
    const box = el('div', { style: 'flex:1;min-width:0' });
    const bar = el('div', { class: 'v-bar' });

    const btnRec = el('button', { class: 'btn xs', text: '● 录音', title: 'MediaRecorder 本地录音，音频只写入本机 IndexedDB，不上传' });
    const dot = el('span', { class: 'rec-dot' });
    dot.hidden = true;
    const timer = el('span', { class: 'pool-tc', text: '00:00' });
    const btnPlay = el('button', { class: 'btn xs', text: '▶ 回放', title: '从本机读取音频回放' });
    btnPlay.disabled = !b.audioRef;
    const stat = el('span', { text: b.audioRef ? '已录制 · 本机存储' : '未录制' });

    bar.appendChild(btnRec); bar.appendChild(dot); bar.appendChild(timer);
    bar.appendChild(btnPlay); bar.appendChild(stat);
    box.appendChild(bar);

    const c = buildEditable(b);
    box.appendChild(c);

    const ui = { btnRec: btnRec, dot: dot, timer: timer, btnPlay: btnPlay, stat: stat, c: c };
    btnRec.addEventListener('click', () => {
      if (rec && rec.blockId === b.id) stopRec();
      else startRec(b, ui);
    });
    btnPlay.addEventListener('click', () => playVoice(b, btnPlay));
    if (rec && rec.blockId === b.id) rec.ui = ui;      // 重绘后重新接上 UI
    return box;
  }

  function srSupported() { return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }

  function startRec(b, ui) {
    if (rec) { U.toast('已有语音块正在录音'); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') {
      U.toast('当前浏览器不支持本地录音，建议使用 Chrome', 'err');
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
      let mr;
      try { mr = new MediaRecorder(stream); }
      catch (e) { stream.getTracks().forEach(t => t.stop()); U.toast('录音器初始化失败', 'err'); return; }

      rec = { blockId: b.id, block: b, ui: ui, mr: mr, stream: stream, chunks: [], sr: null, live: true, finalTxt: '', t0: Date.now(), timer: null };
      mr.addEventListener('dataavailable', e => { if (e.data && e.data.size) rec.chunks.push(e.data); });
      mr.addEventListener('stop', finishRec);
      try { mr.start(); } catch (e) { rec = null; stream.getTracks().forEach(t => t.stop()); U.toast('无法开始录音', 'err'); return; }

      ui.btnRec.textContent = '■ 停止';
      ui.btnRec.classList.add('accent');
      ui.dot.hidden = false;
      ui.btnPlay.disabled = true;
      ui.stat.textContent = '录音中…';
      rec.timer = setInterval(() => {
        if (!rec || !rec.ui) return;
        const s = Math.floor((Date.now() - rec.t0) / 1000);
        rec.ui.timer.textContent = U.pad(s / 60) + ':' + U.pad(s % 60);
      }, 250);

      startSR(ui);
    }).catch(err => {
      U.toast('无法访问麦克风：' + ((err && err.name) || '已被拒绝'), 'err');
    });
  }

  /* 本地实时转写：只用浏览器内置 Web Speech，不接任何云端转写 API（P1） */
  function startSR(ui) {
    if (!srSupported()) {
      rec.noSR = true;
      ui.stat.textContent = '当前浏览器不支持本地实时转写，可先录音，稍后手动补写（Chrome 支持最好）';
      return;
    }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    let sr;
    try { sr = new SR(); } catch (e) { rec.noSR = true; return; }
    sr.lang = 'zh-CN';
    sr.continuous = true;
    sr.interimResults = true;
    sr.addEventListener('result', e => {
      if (!rec) return;
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) rec.finalTxt += r[0].transcript;
        else interim += r[0].transcript;
      }
      if (rec.ui && rec.ui.c && rec.ui.c.isConnected) rec.ui.c.textContent = rec.finalTxt + interim;
    });
    sr.addEventListener('error', ev => {
      if (!rec || !rec.ui) return;
      const code = ev && ev.error;
      if (code === 'not-allowed' || code === 'service-not-allowed') rec.ui.stat.textContent = '转写被拒绝，仅录音（稍后可手动补写）';
      else if (code === 'no-speech') rec.ui.stat.textContent = '没听到声音…';
    });
    sr.addEventListener('end', () => {                 // 长录音时浏览器会自动断，续上
      if (rec && rec.live && rec.sr === sr) { try { sr.start(); } catch (e) { } }
    });
    try { sr.start(); rec.sr = sr; } catch (e) { rec.noSR = true; }
  }

  function stopRec(silent) {
    if (!rec) return;
    rec.live = false;
    rec.silent = !!silent;
    clearInterval(rec.timer);
    if (rec.sr) { try { rec.sr.stop(); } catch (e) { } }
    try { if (rec.mr && rec.mr.state !== 'inactive') rec.mr.stop(); else finishRec(); }
    catch (e) { finishRec(); }
  }

  function finishRec() {
    const v = rec;
    if (!v || v.done) return;
    v.done = true;
    rec = null;
    try { v.stream.getTracks().forEach(t => t.stop()); } catch (e) { }
    const b = v.block, ui = v.ui;
    const alive = ui && ui.c && ui.c.isConnected;
    const blob = new Blob(v.chunks, { type: (v.mr && v.mr.mimeType) || 'audio/webm' });
    const txt = (v.finalTxt || '').trim();

    const done = () => {
      LP.state.push();
      if (txt) { b.transcript = txt; b.content = U.esc(txt); }   // 转写回填到 transcript 与 content
      commit('语音记录');
      if (alive) {
        if (txt) ui.c.innerHTML = sanitize(b.content);
        resetVoiceUI(ui, b, v);
      }
    };

    if (!blob.size) {
      if (alive) ui.stat.textContent = v.noSR ? '没录到声音（也不支持本地转写）' : '没录到声音';
      if (txt) done(); else if (alive) resetVoiceUI(ui, b, v);
      return;
    }
    const key = b.audioRef || ('voice_' + b.id);
    Promise.resolve(LP.storage.putBlob(key, blob)).then(ok => {
      if (ok) b.audioRef = key;
      done();
      if (!ok) U.toast('音频写入本地库失败，转写文本已保留', 'err');
    });
  }

  function resetVoiceUI(ui, b, v) {
    ui.btnRec.textContent = '● 录音';
    ui.btnRec.classList.remove('accent');
    ui.dot.hidden = true;
    ui.btnPlay.disabled = !b.audioRef;
    if (v && v.noSR) ui.stat.textContent = '已录音 · 本浏览器不支持本地转写，请手动补写（Chrome 支持最好）';
    else ui.stat.textContent = b.audioRef ? '已录制 · 本机存储' : '未录制';
  }

  function playVoice(b, btn) {
    if (audio) {
      try { audio.a.pause(); } catch (e) { }
      URL.revokeObjectURL(audio.url);
      const prev = audio; audio = null;
      if (prev.btn) prev.btn.textContent = '▶ 回放';
      if (prev.id === b.id) return;                 // 再点一次 = 停止
    }
    if (!b.audioRef) return U.toast('这个语音块还没有录音', 'err');
    Promise.resolve(LP.storage.getBlob(b.audioRef)).then(blob => {
      if (!blob) return U.toast('本机音频已丢失', 'err');
      const url = URL.createObjectURL(blob);
      const a = new Audio(url);
      audio = { a: a, url: url, btn: btn, id: b.id };
      const cleanup = () => {
        URL.revokeObjectURL(url);
        if (audio && audio.url === url) audio = null;
        if (btn) btn.textContent = '▶ 回放';
      };
      a.addEventListener('ended', cleanup);
      a.addEventListener('error', cleanup);
      a.play().then(() => { if (btn) btn.textContent = '■ 停止'; }).catch(() => { cleanup(); U.toast('回放失败', 'err'); });
    });
  }

  /* ====================================================== 外部变更同步 */
  function onExtChange() {
    if (suppress || !cur.container || !cur.ownerId) return;
    if (!document.contains(cur.container)) return;
    if (rec) return;                       // 录音中不重绘，避免打断
    if (editing()) return;                 // 正在输入不重绘，避免打断焦点
    const fresh = cur.kind === 'group' ? LP.state.group(cur.ownerId) : LP.state.shot(cur.ownerId);
    if (!fresh) { cur.owner = null; paint(); return; }
    const changed = fresh !== cur.owner ||
      (Array.isArray(fresh.blocks) ? fresh.blocks.length : 0) !== cur.container.querySelectorAll('.blk').length;
    cur.owner = fresh;
    if (changed) paint();
  }

  /* ====================================================== init */
  function init() {
    if (inited) return;
    inited = true;
    try { document.execCommand('styleWithCSS', false, false); } catch (e) { }   // 让加粗产出 <b> 而不是 style
    document.addEventListener('keydown', onDocKeydown, true);
    document.addEventListener('click', onDocClick, true);
    window.addEventListener('scroll', () => { if (slash) closeSlash(); }, true);
    LP.bus.on('change', onExtChange);
  }

  /* 供报告/素材包模块取纯文本（R-022 会用到） */
  function toText(list) {
    return (list || []).map(b => {
      const t = plain(b.content) || (b.transcript || '');
      if (b.type === 'divider') return '---';
      if (b.type === 'h1') return '# ' + t;
      if (b.type === 'h2') return '## ' + t;
      if (b.type === 'list') return '- ' + t;
      if (b.type === 'todo') return (b.checked ? '- [x] ' : '- [ ] ') + t;
      if (b.type === 'quote') return '> ' + t;
      if (b.type === 'callout') return '【重点】' + t;
      if (b.type === 'voice') return '（口述）' + t;
      return t;
    }).filter(s => s !== '').join('\n');
  }

  return { render: render, init: init, sanitize: sanitize, toText: toText };
})();


/* ==================== 70-sbd.js ==================== */
/* =========================================================================
 * 拉片台 LaPian Studio — 70 sbd
 * 自动镜头切分 Shot Boundary Detection（传统档：直方图差分 + 自适应阈值）
 *
 * 对应需求：
 *   R-003 自动切分镜头，结果铺满时间线（连续片段，首段从 0，末段到片尾）
 *   R-004 灵敏度滑块控制阈值：一次抽帧、缓存差分序列，之后调阈值纯计算秒回
 *   R-005 人工精修：对话框列表预览，逐切点勾选（取消=合并相邻两段），确认后才写入
 *   R-006 最短镜头时长过滤（默认 0.5s，0.2–5s 可调），压制运镜/抖动伪切点
 *
 * 隐私红线：抽帧、直方图、阈值判定全部在本机浏览器内完成，无任何网络请求。
 * ========================================================================= */
window.LP = window.LP || {};

LP.sbd = (function () {
  'use strict';

  var U = LP.util;

  /* ------------------------------------------------------------- 常量 */
  var BINS = 16;              // 每通道 16 bins（RGB 共 48 维）
  var FEAT = BINS * 3;
  var FRAME_W = 64;           // 抽帧缩放宽度，等比高
  var WIN = 15;               // 自适应阈值局部窗口：前后各 15 帧
  var TRIM = 0.8;             // 局部基线只用窗口内最小的 80%，避免邻近切点抬高基线
  var LONG_VIDEO = 600;       // 超过 10 分钟视为长视频，提示耗时
  var EPS = 1e-6;

  var DEF = { sampleFps: 3, minDur: 0.5, sens: 50 };

  /* ------------------------------------------------------------- 闭包状态 */
  var maskEl = null;          // 对话框根节点
  var inited = false;
  var running = false;
  var cancelFlag = false;

  var opts = { sampleFps: DEF.sampleFps, minDur: DEF.minDur, sens: DEF.sens, useRange: false };

  /** 抽帧缓存：R-004 的关键——阈值调整不再重新抽帧 */
  var cache = null;
  /* cache = {
       key, sampleFps, start, end, n,
       times : Float64Array(n)     每个采样帧的时间
       diffs : Float32Array(n)     diffs[i] = 帧 i-1 与帧 i 的综合差分（diffs[0]=0）
       mu, sd: Float32Array(n)     局部窗口均值/标准差（与灵敏度无关，只算一次）
     } */

  var cands = [];             // 当前阈值下的候选切点 [{t,score,idx}]
  var enabled = [];           // 与 cands 等长，人工精修的勾选状态（R-005）

  /* ============================================================ 基础工具 */

  function el(tag, attrs, children) { return U.el(tag, attrs, children); }
  function q(sel) { return maskEl ? maskEl.querySelector(sel) : null; }

  /** 取主视频的 ObjectURL（离屏抽帧复用同一个 URL，不打断用户正在看的播放器） */
  function videoUrl() {
    if (LP.media && LP.media.objectUrl) return LP.media.objectUrl;
    var v = document.querySelector('#video');
    if (v && v.src) return v.src;
    if (v && v.currentSrc) return v.currentSrc;
    return '';
  }

  function videoDuration() {
    var p = LP.state.project;
    var d = p && p.videoRef && p.videoRef.duration;
    if (isFinite(d) && d > 0) return d;
    var v = document.querySelector('#video');
    if (v && isFinite(v.duration) && v.duration > 0) return v.duration;
    return 0;
  }

  function hasVideo() { return !!videoUrl() && videoDuration() > 0; }

  /** 防御性探测主程序的入出点（各模块字段命名未定，多路兜底；探测不到就禁用区间选项） */
  function getInOut() {
    var holders = [LP.player, LP.viewer, LP.transport, LP.media, LP.state, LP];
    var inKeys = ['inPoint', 'tIn', 'markIn', 'inSec', 'in'];
    var outKeys = ['outPoint', 'tOut', 'markOut', 'outSec', 'out'];
    for (var h = 0; h < holders.length; h++) {
      var o = holders[h];
      if (!o || typeof o !== 'object') continue;
      var a = null, b = null, k;
      for (k = 0; k < inKeys.length; k++) if (typeof o[inKeys[k]] === 'number') { a = o[inKeys[k]]; break; }
      for (k = 0; k < outKeys.length; k++) if (typeof o[outKeys[k]] === 'number') { b = o[outKeys[k]]; break; }
      if (a != null && b != null && isFinite(a) && isFinite(b) && b - a > 0.3) return { in: a, out: b };
      if (o.io && typeof o.io === 'object' && isFinite(o.io.in) && isFinite(o.io.out) && o.io.out - o.io.in > 0.3) {
        return { in: o.io.in, out: o.io.out };
      }
    }
    return null;
  }

  /** 等一个事件（带超时与 error 兜底） */
  function once(target, ev, ms) {
    return new Promise(function (res, rej) {
      var done = false;
      function clean() {
        target.removeEventListener(ev, ok);
        target.removeEventListener('error', bad);
        clearTimeout(timer);
      }
      function ok() { if (done) return; done = true; clean(); res(); }
      function bad() { if (done) return; done = true; clean(); rej(new Error('MEDIA_ERROR')); }
      var timer = setTimeout(function () { if (done) return; done = true; clean(); rej(new Error('TIMEOUT')); }, ms || 15000);
      target.addEventListener(ev, ok);
      target.addEventListener('error', bad);
    });
  }

  /** 串行 seek：等 seeked 事件，避免并发 seek 抖动 */
  function seekTo(v, t) {
    return new Promise(function (res) {
      if (Math.abs(v.currentTime - t) < 1e-4 && v.readyState >= 2) return res();
      var done = false;
      function ok() { if (done) return; done = true; clean(); res(); }
      function clean() { v.removeEventListener('seeked', ok); clearTimeout(timer); }
      var timer = setTimeout(ok, 5000);   // 单帧超时也继续，不让整条流程卡死
      v.addEventListener('seeked', ok);
      try { v.currentTime = t; } catch (e) { ok(); }
    });
  }

  function secText(s) {
    s = Math.max(0, Math.round(s));
    if (s < 90) return s + ' 秒';
    return Math.floor(s / 60) + ' 分 ' + (s % 60) + ' 秒';
  }

  /* ============================================================ 特征与差分 */

  /**
   * 单帧特征：RGB 三通道 16-bins 直方图（各自归一化）+ 灰度均值
   * 返回 {h: Float32Array(48), lum: Number}
   *
   * 采用「线性软分箱」而非 v>>4 硬分箱：每个像素按其在箱内的亚位置，
   * 把权重按比例分给相邻两个箱。
   * 原因：硬分箱下，大面积同色画面在缓慢变亮/变暗时，所有像素会在同一瞬间
   * 整体跨过箱边界，直方图差分从 0 直接跳到满值，被误判成硬切
   * （表现为曝光漂移、灯光渐变、天色变化被切成一堆碎片）。
   * 软分箱让直方图随亮度连续平移，渐变不再产生阶跃，真正的硬切依然是尖峰。
   */
  function frameFeature(ctx, w, h) {
    var img = ctx.getImageData(0, 0, w, h);
    var d = img.data, len = d.length;
    var hist = new Float32Array(FEAT);
    var lum = 0, n = 0;
    var MAXB = BINS - 1;
    /* 把 0–255 映射到箱中心坐标：x = v/16 - 0.5，落在 [-0.5, 15.5] */
    function put(off, v) {
      var x = v * (1 / 16) - 0.5;
      var i0 = Math.floor(x);
      var f = x - i0;                       // 到下一个箱的距离，0–1
      if (i0 < 0) { hist[off] += 1; return; }
      if (i0 >= MAXB) { hist[off + MAXB] += 1; return; }
      hist[off + i0] += 1 - f;
      hist[off + i0 + 1] += f;
    }
    for (var i = 0; i < len; i += 4) {
      var r = d[i], g = d[i + 1], b = d[i + 2];
      put(0, r);
      put(BINS, g);
      put(BINS * 2, b);
      lum += 0.299 * r + 0.587 * g + 0.114 * b;
      n++;
    }
    if (n > 0) for (var k = 0; k < FEAT; k++) hist[k] /= n;   // 每通道各自 sum=1
    return { h: hist, lum: n ? lum / n : 0 };
  }

  /** 直方图交叉距离（0–1）：1 - Σmin(a,b)，三通道平均 */
  function distIntersect(a, b) {
    var s = 0;
    for (var c = 0; c < 3; c++) {
      var inter = 0, off = c * BINS;
      for (var k = 0; k < BINS; k++) inter += Math.min(a[off + k], b[off + k]);
      s += 1 - inter;
    }
    return s / 3;
  }

  /** 卡方距离归一化到 0–1：Σ(a-b)²/(a+b) 上限为 2，除 2 */
  function distChi2(a, b) {
    var s = 0;
    for (var c = 0; c < 3; c++) {
      var v = 0, off = c * BINS;
      for (var k = 0; k < BINS; k++) {
        var x = a[off + k], y = b[off + k], sum = x + y;
        if (sum > EPS) { var d = x - y; v += d * d / sum; }
      }
      s += v / 2;
    }
    return U.clamp(s / 3, 0, 1);
  }

  /** 综合帧间差分：直方图为主（交叉+卡方各半），亮度突变作辅助信号 */
  function frameDiff(fa, fb) {
    var dh = 0.5 * distIntersect(fa.h, fb.h) + 0.5 * distChi2(fa.h, fb.h);
    var dl = Math.min(1, Math.abs(fa.lum - fb.lum) / 72);
    return U.clamp(0.85 * dh + 0.15 * dl, 0, 1);
  }

  /**
   * 局部窗口（前后各 WIN 帧，排除自身）的均值与标准差 —— 与灵敏度无关，只算一次。
   * 用「截尾」统计（丢掉窗口内最高的 20%）：快切段落里相邻切点会把普通均值抬得很高，
   * 导致该抬高的基线反过来把真切点吃掉；截尾后基线只反映"镜头内部的正常波动"。
   */
  function localStats(diffs) {
    var n = diffs.length;
    var mu = new Float32Array(n), sd = new Float32Array(n);
    var buf = [];
    for (var i = 0; i < n; i++) {
      var a = Math.max(1, i - WIN), b = Math.min(n - 1, i + WIN);
      buf.length = 0;
      for (var j = a; j <= b; j++) { if (j !== i) buf.push(diffs[j]); }
      if (!buf.length) { mu[i] = 0; sd[i] = 0; continue; }
      buf.sort(function (x, y) { return x - y; });
      var m = Math.min(buf.length, Math.max(3, Math.round(buf.length * TRIM)));
      var s = 0, s2 = 0;
      for (var k = 0; k < m; k++) { s += buf[k]; s2 += buf[k] * buf[k]; }
      var av = s / m, va = Math.max(0, s2 / m - av * av);
      mu[i] = av; sd[i] = Math.sqrt(va);
    }
    return { mu: mu, sd: sd };
  }

  /* ============================================================ 抽帧主流程 */

  /**
   * 整片（或选定区间）抽帧 → 差分序列。串行 seek，可取消。
   * onProgress(done,total,etaSec)
   */
  async function extract(cfg, onProgress) {
    var url = videoUrl();
    if (!url) throw new Error('NO_VIDEO');

    var v = document.createElement('video');
    var cv = document.createElement('canvas');
    var ctx = null;

    try {
      v.preload = 'auto';
      v.muted = true; v.defaultMuted = true; v.volume = 0;
      v.playsInline = true; v.setAttribute('playsinline', '');
      v.src = url;
      await once(v, 'loadeddata', 20000);

      var vw = v.videoWidth || 0, vh = v.videoHeight || 0;
      var w = FRAME_W;
      var h = vw > 0 ? Math.max(2, Math.round(FRAME_W * vh / vw)) : 36;
      cv.width = w; cv.height = h;
      ctx = cv.getContext('2d', { willReadFrequently: true });

      var start = cfg.start, end = cfg.end;
      var step = 1 / cfg.sampleFps;
      var n = Math.max(2, Math.floor((end - start) / step) + 1);

      var times = new Float64Array(n);
      var diffs = new Float32Array(n);
      var prev = null;
      var t0 = performance.now();

      for (var i = 0; i < n; i++) {
        if (cancelFlag) throw new Error('CANCELLED');
        var t = Math.min(end - 1e-3, start + i * step);
        times[i] = t;
        await seekTo(v, t);
        if (cancelFlag) throw new Error('CANCELLED');

        ctx.drawImage(v, 0, 0, w, h);
        var f;
        try {
          f = frameFeature(ctx, w, h);
        } catch (e) {
          throw new Error('TAINTED');           // 画布被污染（安全策略）
        }
        diffs[i] = prev ? frameDiff(prev, f) : 0;
        prev = f;

        if (onProgress && (i % 3 === 0 || i === n - 1)) {
          var el2 = (performance.now() - t0) / 1000;
          var eta = i > 2 ? el2 / (i + 1) * (n - i - 1) : 0;
          onProgress(i + 1, n, eta);
        }
      }

      var st = localStats(diffs);
      return {
        key: cfg.key, sampleFps: cfg.sampleFps, start: start, end: end, n: n,
        times: times, diffs: diffs, mu: st.mu, sd: st.sd
      };
    } finally {
      /* 清理离屏 video / canvas，防止内存泄漏（注意：ObjectURL 与主播放器共用，不能 revoke） */
      try { v.pause(); } catch (e) { }
      try { v.removeAttribute('src'); v.load(); } catch (e) { }
      try { cv.width = 0; cv.height = 0; } catch (e) { }
      ctx = null; cv = null; v = null;
    }
  }

  /* ============================================================ 切点判定 */

  /** 灵敏度 0–100 → 自适应系数 k 与绝对下限（对标达芬奇那条紫色阈值线） */
  function sensParams(s) {
    var r = U.clamp(s, 0, 100) / 100;
    return {
      k: 6.0 - 4.6 * r,                          // 6.0（保守）→ 1.4（激进）
      floor: 0.34 - 0.30 * Math.pow(r, 0.85),    // 0.34 → 0.04
      /* 相对倍率闸门：切点差分至少要达到局部基线的多少倍。
       * 为什么需要它：匀速变化的画面（灯光渐亮、天色变化、缓慢变焦、云层移动）
       * 会产生一串「幅度恒定」的差分，此时局部标准差趋近于 0，
       * 「均值 + k×标准差」这个阈值就退化成了均值本身，噪声会成片越线被切碎。
       * 加上倍率闸门后，只有明显高于周围水平的尖峰才算切点，匀速漂移天然被排除。 */
      ratio: 2.8 - 1.3 * r                        // 2.8（保守）→ 1.5（激进）
    };
  }

  /**
   * 从缓存的差分序列算切点：自适应阈值 + 非极大值抑制 + 最短镜头过滤
   * 纯计算，无 IO —— R-004 秒回的根据
   */
  function pickCuts(c, sens, minDur) {
    if (!c) return [];
    var p = sensParams(sens);
    var n = c.n, i;

    /* 1) 自适应阈值：显著高于局部基线才算硬切，整体偏亮/偏暗片段不会被误判 */
    var raw = [];
    for (i = 1; i < n; i++) {
      /* 三道闸门取最严：绝对下限 / 局部离群度 / 相对倍率 */
      var thr = Math.max(p.floor, c.mu[i] + p.k * c.sd[i], p.ratio * c.mu[i]);
      if (c.diffs[i] >= thr) raw.push(i);
    }

    /* 2) 非极大值抑制：连续多帧超阈值时只取最高峰 */
    var rad = Math.max(1, Math.round(c.sampleFps * 0.4));
    var order = raw.slice().sort(function (a, b) { return c.diffs[b] - c.diffs[a]; });
    var killed = {};
    var keep = [];
    for (i = 0; i < order.length; i++) {
      var idx = order[i];
      if (killed[idx]) continue;
      keep.push(idx);
      for (var j = idx - rad; j <= idx + rad; j++) if (j !== idx) killed[j] = 1;
    }
    keep.sort(function (a, b) { return a - b; });

    /* 3) 切点时刻取相邻两采样帧的中点，误差最小（精度 ≈ 1/(2·采样率)） */
    var list = keep.map(function (ix) {
      return { idx: ix, t: +(((c.times[ix - 1] + c.times[ix]) / 2)).toFixed(3), score: c.diffs[ix] };
    });

    /* 4) R-006 最短镜头过滤：反复剔除"造成过短片段"的最弱切点 */
    return applyMinDur(list, c.start, c.end, minDur);
  }

  function applyMinDur(list, start, end, minDur) {
    if (!(minDur > 0)) return list;
    var out = list.slice();
    var guard = 0;
    while (guard++ < 20000 && out.length) {
      var b = [start], i;
      for (i = 0; i < out.length; i++) b.push(out[i].t);
      b.push(end);
      var worst = -1, worstLen = Infinity;
      for (i = 0; i < b.length - 1; i++) {
        var len = b[i + 1] - b[i];
        if (len < minDur - 1e-6 && len < worstLen) { worstLen = len; worst = i; }
      }
      if (worst < 0) break;
      var L = worst - 1;                                  // 该段左界切点在 out 中的下标
      var R = worst < out.length ? worst : -1;            // 右界切点
      var del;
      if (L < 0) del = R;
      else if (R < 0) del = L;
      else del = (out[L].score <= out[R].score) ? L : R;
      if (del == null || del < 0) break;
      out.splice(del, 1);
    }
    return out;
  }

  /** 由勾选状态生成连续片段（R-003：铺满，首段从 start，末段到 end） */
  function buildSegments() {
    if (!cache) return [];
    var bs = [cache.start];
    for (var i = 0; i < cands.length; i++) if (enabled[i]) bs.push(cands[i].t);
    bs.push(cache.end);
    var segs = [];
    for (var j = 0; j < bs.length - 1; j++) {
      var a = +bs[j].toFixed(3), b = +bs[j + 1].toFixed(3);
      if (b - a > 0.02) segs.push({ in: a, out: b });
    }
    return segs;
  }

  /* ============================================================ 对话框 UI */

  function open() {
    if (maskEl) return;                                   // 已打开，忽略重复调用
    if (!hasVideo()) { U.toast('请先导入视频', 'err'); return; }
    buildModal();
    if (cache && cache.key === cacheKey()) {              // 同一视频/同参数：直接显示上次结果
      recompute();
      showStage('result');
    } else {
      showStage('setup');
    }
  }

  function cacheKey() {
    var p = LP.state.project, r = rangeOf();
    var vr = (p && p.videoRef) || {};
    return [vr.name || '', vr.size || 0, videoDuration().toFixed(3), opts.sampleFps, r.start.toFixed(3), r.end.toFixed(3)].join('|');
  }

  function rangeOf() {
    var dur = videoDuration();
    var io = opts.useRange ? getInOut() : null;
    if (io) return { start: U.clamp(io.in, 0, dur), end: U.clamp(io.out, 0, dur) };
    return { start: 0, end: dur };
  }

  function buildModal() {
    var dur = videoDuration();
    var io = getInOut();
    var longV = dur > LONG_VIDEO;

    maskEl = el('div', { class: 'mask' });
    maskEl.innerHTML =
      '<div class="modal" style="width:min(920px,95vw)">' +
      '  <div class="modal-hd">' +
      '    <h3>自动切分镜头</h3>' +
      '    <span class="badge">本地计算 · 素材不出机</span>' +
      '    <span class="grow"></span>' +
      '    <span class="badge">R-003 / R-004 / R-005 / R-006</span>' +
      '  </div>' +
      '  <div class="modal-bd">' +

      '    <div class="card" style="padding:9px 12px;margin-bottom:11px">' +
      '      <div style="font-size:12px;color:var(--txt2);line-height:1.75">' +
      '        本工具做的是<b style="color:var(--txt)">镜头边界检测</b>（切镜头），不是内容理解型的 AI 高光切片；自动结果一定要人工精修。' +
      '      </div>' +
      '    </div>' +

      /* ---------- 参数区 ---------- */
      '    <div id="sbdSetup">' +
      '      <div class="stat-grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:11px">' +
      '        <div class="stat"><div class="sv" style="font-size:15px">' + U.esc(U.dur(dur)) + '</div><div class="sl">视频时长</div></div>' +
      '        <div class="stat"><div class="sv" style="font-size:15px" id="sbdFrameEst">—</div><div class="sl">预计抽帧数</div></div>' +
      '        <div class="stat"><div class="sv" style="font-size:15px">' + (LP.state.project.shots.length) + '</div><div class="sl">现有片段</div></div>' +
      '      </div>' +
      '      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px">' +
      '        <label style="display:block">' +
      '          <div style="font-size:11.5px;color:var(--txt2);margin-bottom:4px">采样率（越高越准、越慢）</div>' +
      '          <select id="sbdFps" class="mini-input">' +
      '            <option value="2">2 fps · 最快</option>' +
      '            <option value="3" selected>3 fps · 推荐</option>' +
      '            <option value="4">4 fps · 更准</option>' +
      '          </select>' +
      '        </label>' +
      '        <div>' +
      '          <div style="font-size:11.5px;color:var(--txt2);margin-bottom:4px">最短镜头时长（R-006）<span id="sbdMinLb" style="color:var(--accent);font-family:var(--mono)"> 0.5s</span></div>' +
      '          <input type="range" id="sbdMin" min="0.2" max="5" step="0.1" value="0.5" style="width:100%">' +
      '        </div>' +
      '      </div>' +
      '      <div style="margin-top:9px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">' +
      '        <label class="chk"><input type="checkbox" id="sbdRange"' + (io ? '' : ' disabled') + '> 仅分析当前入出点区间' +
      (io ? '<span class="pool-tc" style="margin-left:4px">' + U.esc(U.tc(io.in)) + ' – ' + U.esc(U.tc(io.out)) + '</span>'
        : '<span class="pool-tc" style="margin-left:4px">（未设置入出点）</span>') +
      '        </label>' +
      '      </div>' +
      (longV
        ? '      <div class="badge risk" style="display:block;margin-top:10px;padding:6px 9px;line-height:1.7">' +
        '        这是一条长视频（' + U.esc(U.dur(dur)) + '）。整片抽帧需要逐帧 seek，可能耗时数分钟；建议先设好入出点，只分析要拉的段落。' +
        '      </div>'
        : '') +
      '    </div>' +

      /* ---------- 进度区 ---------- */
      '    <div id="sbdProg" hidden>' +
      '      <div style="font-size:12.5px;color:var(--txt2)" id="sbdProgTxt">准备中…</div>' +
      '      <div class="prog"><i id="sbdProgBar"></i></div>' +
      '      <div class="pool-tc" style="margin-top:6px">正在本机解码抽帧，未发生任何网络传输。</div>' +
      '    </div>' +

      /* ---------- 结果区 ---------- */
      '    <div id="sbdResult" hidden>' +
      '      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px">' +
      '        <div style="flex:1;min-width:240px">' +
      '          <div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--txt2)">' +
      '            <span>灵敏度（R-004 · 阈值线）</span><span id="sbdSensLb" class="pool-tc"></span>' +
      '          </div>' +
      '          <input type="range" id="sbdSens" min="0" max="100" step="1" value="50" style="width:100%">' +
      '          <div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--txt3)"><span>保守 · 少切</span><span>激进 · 多切</span></div>' +
      '        </div>' +
      '        <div style="flex:1;min-width:200px">' +
      '          <div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--txt2)">' +
      '            <span>最短镜头（R-006）</span><span id="sbdMin2Lb" class="pool-tc"></span>' +
      '          </div>' +
      '          <input type="range" id="sbdMin2" min="0.2" max="5" step="0.1" value="0.5" style="width:100%">' +
      '          <div style="font-size:10.5px;color:var(--txt3)">调整这两项<b>不会</b>重新抽帧，实时重算。</div>' +
      '        </div>' +
      '      </div>' +
      '      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--line)">' +
      '        <b id="sbdCount" style="color:var(--accent)">—</b>' +
      '        <span class="pool-tc" id="sbdMeta"></span>' +
      '        <span class="grow"></span>' +
      '        <button class="btn xs" id="sbdAll">全选切点</button>' +
      '        <button class="btn xs" id="sbdNone">全不选</button>' +
      '      </div>' +
      '      <div style="display:flex;gap:7px;padding:3px 6px;font-size:10.5px;color:var(--txt3);border-bottom:1px solid var(--line)">' +
      '        <span style="width:16px"></span><span style="width:38px">序号</span><span style="width:98px">入点</span>' +
      '        <span style="width:98px">出点</span><span style="width:62px">时长</span><span style="flex:1">切点差分强度</span>' +
      '      </div>' +
      '      <div id="sbdList" style="max-height:266px;overflow:auto;padding:3px 0"></div>' +
      '      <div class="pool-tc" style="margin-top:7px">取消勾选某个切点 = 把它前后两段合并（R-005）。切点精度约 ±<span id="sbdPrec">0.17</span>s，写入后可在时间线上手动微调。</div>' +
      '    </div>' +

      '  </div>' +
      '  <div class="modal-ft">' +
      '    <span class="grow"></span>' +
      '    <button class="btn" id="sbdClose">关闭</button>' +
      '    <button class="btn" id="sbdCancel" hidden>取消分析</button>' +
      '    <button class="btn" id="sbdRedo" hidden>重新抽帧</button>' +
      '    <button class="btn accent" id="sbdRun">开始分析</button>' +
      '    <button class="btn accent" id="sbdApply" hidden>写入工程</button>' +
      '  </div>' +
      '</div>';

    document.body.appendChild(maskEl);

    /* --- 参数区交互 --- */
    var fps = q('#sbdFps'), mn = q('#sbdMin'), rg = q('#sbdRange');
    fps.value = String(opts.sampleFps);
    mn.value = String(opts.minDur);
    rg.checked = !!(opts.useRange && io);
    q('#sbdMinLb').textContent = ' ' + (+mn.value).toFixed(1) + 's';
    updateFrameEst();

    fps.addEventListener('change', function () { opts.sampleFps = +fps.value; updateFrameEst(); });
    mn.addEventListener('input', function () {
      opts.minDur = +mn.value;
      q('#sbdMinLb').textContent = ' ' + opts.minDur.toFixed(1) + 's';
    });
    rg.addEventListener('change', function () { opts.useRange = rg.checked; updateFrameEst(); });

    /* --- 结果区交互（纯计算，秒回） --- */
    var sens = q('#sbdSens'), mn2 = q('#sbdMin2');
    sens.value = String(opts.sens);
    mn2.value = String(opts.minDur);
    sens.addEventListener('input', function () { opts.sens = +sens.value; recompute(); });
    mn2.addEventListener('input', function () { opts.minDur = +mn2.value; recompute(); });

    q('#sbdAll').addEventListener('click', function () { setAll(true); });
    q('#sbdNone').addEventListener('click', function () { setAll(false); });
    q('#sbdList').addEventListener('change', onRowToggle);

    /* --- 底部按钮 --- */
    q('#sbdRun').addEventListener('click', runAnalyze);
    q('#sbdRedo').addEventListener('click', function () { cache = null; showStage('setup'); });
    q('#sbdCancel').addEventListener('click', function () { cancelFlag = true; });
    q('#sbdClose').addEventListener('click', close);
    q('#sbdApply').addEventListener('click', apply);

    maskEl.addEventListener('mousedown', function (e) { if (e.target === maskEl && !running) close(); });
    document.addEventListener('keydown', onKey, true);
  }

  function onKey(e) {
    if (!maskEl) return;
    if (e.key === 'Escape') {
      e.stopPropagation(); e.preventDefault();
      if (running) cancelFlag = true; else close();
    }
  }

  function close() {
    if (!maskEl) return;
    cancelFlag = true;
    document.removeEventListener('keydown', onKey, true);
    maskEl.remove();
    maskEl = null;
  }

  function updateFrameEst() {
    if (!maskEl) return;
    var r = rangeOf();
    var n = Math.max(2, Math.floor((r.end - r.start) / (1 / opts.sampleFps)) + 1);
    var box = q('#sbdFrameEst');
    if (box) box.textContent = n + ' 帧';
  }

  function showStage(stage) {
    if (!maskEl) return;
    var map = {
      setup: { sbdSetup: 1, sbdProg: 0, sbdResult: 0, sbdRun: 1, sbdCancel: 0, sbdRedo: 0, sbdApply: 0, sbdClose: 1 },
      busy: { sbdSetup: 0, sbdProg: 1, sbdResult: 0, sbdRun: 0, sbdCancel: 1, sbdRedo: 0, sbdApply: 0, sbdClose: 0 },
      result: { sbdSetup: 0, sbdProg: 0, sbdResult: 1, sbdRun: 0, sbdCancel: 0, sbdRedo: 1, sbdApply: 1, sbdClose: 1 }
    }[stage];
    for (var id in map) {
      var n = q('#' + id);
      if (n) n.hidden = !map[id];
    }
  }

  /* ============================================================ 分析执行 */

  async function runAnalyze() {
    if (running) { U.toast('上一次分析正在收尾，稍等一下'); return; }
    if (!hasVideo()) { U.toast('请先导入视频', 'err'); return; }
    running = true; cancelFlag = false;
    showStage('busy');
    var bar = q('#sbdProgBar'), txt = q('#sbdProgTxt');
    var r = rangeOf();

    try {
      var data = await extract(
        { key: cacheKey(), sampleFps: opts.sampleFps, start: r.start, end: r.end },
        function (done, total, eta) {
          if (!maskEl) return;
          bar.style.width = (done / total * 100).toFixed(1) + '%';
          txt.textContent = '已分析 ' + done + '/' + total + ' 帧 · 预计剩余 ' + secText(eta);
        }
      );
      cache = data;
      if (!maskEl) return;
      recompute();
      showStage('result');
      U.toast('抽帧完成，共 ' + data.n + ' 帧');
    } catch (err) {
      if (!maskEl) return;
      var msg = String(err && err.message);
      if (msg === 'CANCELLED') { U.toast('已取消分析'); showStage('setup'); }
      else if (msg === 'TAINTED') { U.toast('浏览器安全策略阻止读取视频帧，无法分析', 'err'); showStage('setup'); }
      else if (msg === 'NO_VIDEO') { U.toast('请先导入视频', 'err'); showStage('setup'); }
      else { console.error('[sbd]', err); U.toast('抽帧失败：' + msg, 'err'); showStage('setup'); }
    } finally {
      running = false; cancelFlag = false;
    }
  }

  /** R-004：阈值/最短时长变化 → 只重算，不重新抽帧 */
  function recompute() {
    if (!cache) return;
    cands = pickCuts(cache, opts.sens, opts.minDur);
    enabled = cands.map(function () { return true; });
    renderResult();
  }

  function setAll(v) {
    enabled = cands.map(function () { return !!v; });
    renderResult();
  }

  function onRowToggle(e) {
    var t = e.target;
    if (!t || t.type !== 'checkbox') return;
    var i = +t.getAttribute('data-i');
    if (isNaN(i) || i < 0 || i >= enabled.length) return;
    enabled[i] = t.checked;
    renderResult();
  }

  function renderResult() {
    if (!maskEl || !cache) return;
    var p = sensParams(opts.sens);
    var on = enabled.filter(Boolean).length;

    q('#sbdSensLb').textContent = opts.sens + ' · k=' + p.k.toFixed(1) + ' · 下限 ' + p.floor.toFixed(2) + ' · 倍率 ' + p.ratio.toFixed(1) + '×';
    q('#sbdMin2Lb').textContent = opts.minDur.toFixed(1) + 's';
    var m1 = q('#sbdMin'); if (m1) { m1.value = String(opts.minDur); q('#sbdMinLb').textContent = ' ' + opts.minDur.toFixed(1) + 's'; }
    q('#sbdPrec').textContent = (0.5 / cache.sampleFps).toFixed(2);
    q('#sbdCount').textContent = '当前将切出 ' + (on + 1) + ' 个镜头';
    q('#sbdMeta').textContent = '采样 ' + cache.n + ' 帧 @' + cache.sampleFps + 'fps · 候选切点 ' + cands.length +
      ' · 已启用 ' + on + ' · 区间 ' + U.tc(cache.start) + ' – ' + U.tc(cache.end);
    renderList();
  }

  function renderList() {
    var box = q('#sbdList');
    if (!box) return;
    var i;

    /* 行 = 候选切点开出来的段；未勾选的行标为"并入上一段"，行序稳定不跳动 */
    var rows = [{ cut: -1, tIn: cache.start }];   // 第一行是片头，没有切点
    for (i = 0; i < cands.length; i++) rows.push({ cut: i, tIn: cands[i].t });

    var effIdx = 0;
    var html = '';
    for (i = 0; i < rows.length; i++) {
      var r = rows[i];
      var isOn = r.cut < 0 ? true : !!enabled[r.cut];
      var tIn = r.tIn, tOut = cache.end;
      if (isOn) {
        for (var j = i + 1; j < rows.length; j++) {
          if (rows[j].cut >= 0 && enabled[rows[j].cut]) { tOut = rows[j].tIn; break; }
        }
        effIdx++;
      }
      var sc = r.cut < 0 ? 0 : cands[r.cut].score;
      var pct = Math.round(U.clamp(sc, 0, 1) * 100);
      var dim = isOn ? '' : 'opacity:.42;';

      html += '<label class="pool-item" style="gap:7px;' + dim + '">' +
        (r.cut < 0
          ? '<span style="width:16px;text-align:center;color:var(--txt3)">·</span>'
          : '<input type="checkbox" data-i="' + r.cut + '"' + (isOn ? ' checked' : '') + ' style="width:16px">') +
        '<span class="pool-idx" style="width:38px">' + (isOn ? '#' + effIdx : '—') + '</span>' +
        '<span class="pool-tc" style="width:98px">' + U.esc(U.tc(tIn)) + '</span>' +
        '<span class="pool-tc" style="width:98px">' + (isOn ? U.esc(U.tc(tOut)) : '<span style="color:var(--txt3)">↑ 并入上一段</span>') + '</span>' +
        '<span class="pool-tc" style="width:62px">' + (isOn ? U.esc(U.dur(tOut - tIn)) : '') + '</span>' +
        '<span style="flex:1;display:flex;align-items:center;gap:6px">' +
        (r.cut < 0
          ? '<span class="pool-tc" style="color:var(--txt3)">片头</span>'
          : '<span class="prog" style="margin:0;flex:1;max-width:120px"><i style="width:' + pct + '%;background:' +
          (sc >= 0.5 ? 'var(--ok)' : sc >= 0.3 ? 'var(--warn)' : 'var(--danger)') + '"></i></span>' +
          '<span class="pool-tc" style="width:38px">' + sc.toFixed(2) + '</span>') +
        '</span>' +
        '</label>';
    }
    box.innerHTML = html;
  }

  /* ============================================================ 写入工程 */

  function apply() {
    var segs = buildSegments();
    if (!segs.length) { U.toast('没有可写入的片段', 'err'); return; }
    var existing = LP.state.project.shots.length;
    if (!existing) return writeShots(segs, 'replace');
    askMode(segs.length, existing, function (mode) { if (mode) writeShots(segs, mode); });
  }

  /** 已有片段时询问：替换全部 / 追加保留 */
  function askMode(nNew, nOld, cb) {
    var m = el('div', { class: 'mask', style: 'z-index:320' });
    m.innerHTML =
      '<div class="modal" style="min-width:min(420px,92vw)">' +
      '  <div class="modal-hd"><h3>工程里已有 ' + nOld + ' 个片段</h3></div>' +
      '  <div class="modal-bd">' +
      '    <div style="font-size:12.5px;color:var(--txt2);line-height:1.8">本次将写入 <b style="color:var(--accent)">' + nNew + '</b> 个新片段，怎么处理已有内容？</div>' +
      '    <div class="mode" data-m="replace"><div class="m-t">替换全部</div><div class="m-d">清空现有片段与段落组，用自动切分结果重建时间线。已填的维度标注会一起丢失（可 Cmd/Ctrl+Z 撤销）。</div></div>' +
      '    <div class="mode" data-m="append"><div class="m-t">追加保留</div><div class="m-d">保留现有片段，只补写不与它们重叠的新片段；重叠的自动跳过。</div></div>' +
      '  </div>' +
      '  <div class="modal-ft"><button class="btn" data-m="">取消</button></div>' +
      '</div>';
    document.body.appendChild(m);
    m.addEventListener('click', function (e) {
      var n = e.target.closest ? e.target.closest('[data-m]') : null;
      if (!n && e.target !== m) return;
      var mode = n ? n.getAttribute('data-m') : '';
      m.remove();
      cb(mode || null);
    });
  }

  function writeShots(segs, mode) {
    LP.state.push();
    var p = LP.state.project;
    var added = 0, skipped = 0;

    if (mode === 'replace') {
      p.shots = segs.map(function (s) { return LP.model.newShot(s.in, s.out); });
      p.groups = [];                                  // 成员片段已全部消失，空组一并清掉
      added = p.shots.length;
    } else {
      var old = p.shots.slice();
      segs.forEach(function (s) {
        var hit = old.some(function (o) { return s.in < o.out - 1e-3 && o.in < s.out - 1e-3; });
        if (hit) { skipped++; return; }
        p.shots.push(LP.model.newShot(s.in, s.out));
        added++;
      });
    }

    LP.state.commit('自动切分');
    if (mode === 'replace') LP.state.select([], null);
    U.toast('已切出 ' + added + ' 个镜头' + (skipped ? '（跳过 ' + skipped + ' 个重叠片段）' : ''), 'ok');
    close();
  }

  /* ============================================================ 编程接口 */

  /**
   * 无 UI 的检测接口：抽帧 + 判定，返回切点与片段（不写工程）
   * opts: {sampleFps, minDur, sens, start, end, onProgress}
   */
  async function detect(o) {
    o = o || {};
    var dur = videoDuration();
    /* 容忍直观别名：fps→sampleFps，sensitivity→sens，minShot/minLen→minDur */
    var sampleFps = o.sampleFps != null ? o.sampleFps
      : (o.fps != null ? o.fps : DEF.sampleFps);
    var sens = o.sens != null ? o.sens
      : (o.sensitivity != null ? o.sensitivity : DEF.sens);
    var minDur = o.minDur != null ? o.minDur
      : (o.minShot != null ? o.minShot : (o.minLen != null ? o.minLen : DEF.minDur));
    var cfg = {
      sampleFps: sampleFps,
      minDur: minDur,
      sens: sens,
      start: U.clamp(o.start || 0, 0, dur),
      end: U.clamp(o.end == null ? dur : o.end, 0, dur)
    };
    if (!(cfg.end - cfg.start > 0.1)) throw new Error('NO_VIDEO');
    cancelFlag = false;
    var data = await extract({ key: 'api', sampleFps: cfg.sampleFps, start: cfg.start, end: cfg.end }, o.onProgress || null);
    var cuts = pickCuts(data, cfg.sens, cfg.minDur);
    var bs = [data.start].concat(cuts.map(function (c) { return c.t; }), [data.end]);
    var segments = [];
    for (var i = 0; i < bs.length - 1; i++) {
      if (bs[i + 1] - bs[i] > 0.02) segments.push({ in: +bs[i].toFixed(3), out: +bs[i + 1].toFixed(3) });
    }
    return { frames: data.n, sampleFps: data.sampleFps, cuts: cuts, segments: segments };
  }

  /* ============================================================ 初始化 */

  function init() {
    if (inited) return;
    inited = true;
    var btn = document.querySelector('#btnAutoCut');
    if (btn) btn.addEventListener('click', function () { open(); });
    if (LP.bus) LP.bus.on('project:loaded', function () { cache = null; cands = []; enabled = []; });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else setTimeout(init, 0);

  return { open: open, detect: detect, init: init };
})();


/* ==================== 80-export-ai.js ==================== */
/* =========================================================================
 * 80 export / ai — 导出 CSV / Markdown / 素材包 / 工程 JSON + AI 三模式
 * R-022 素材包汇总（维度+文字+转写）并导出
 * R-023 AI 三模式，默认模式③（导出素材包手动分析），不默认调云端
 * R-024 导出 CSV / 复制 Markdown / 导出素材包
 * R-025 工程 JSON 导入导出（不含视频本体）
 * ========================================================================= */
LP.exporter = (function () {
  const U = LP.util;
  const TEXT_FIELDS = () => LP.FIELDS.filter(f => ['select', 'multi', 'text', 'longtext'].indexOf(f.type) >= 0);

  function rows() {
    /* 优先用多维表当前筛选结果，保证"所见即所得导出" */
    if (LP.table && LP.table.currentRows) {
      const r = LP.table.currentRows();
      if (r && r.length) return r;
    }
    return LP.state.shots();
  }
  const val = (s, f) => {
    if (f.type === 'multi') return (s[f.key] || []).join('/');
    if (f.type === 'formula') return (s.out - s.in).toFixed(2);
    if (f.type === 'relation') { const g = s.groupId && LP.state.group(s.groupId); return g ? g.name : ''; }
    if (f.type === 'attachment') return s.thumb ? '有' : '';
    return s[f.key] || '';
  };
  /* 镜头在全片中的序号（不依赖时间线模块，避免导出时因模块未就绪而崩溃） */
  function shotNo(s) {
    const i = LP.state.shots().findIndex(x => x.id === s.id);
    return i < 0 ? '?' : (i + 1);
  }

  /* ------------------------------------------------------- R-024 CSV */
  function toCSV() {
    const fs = LP.FIELDS.filter(f => f.type !== 'attachment');
    const head = ['序号', '入点', '出点', '时长(s)'].concat(fs.filter(f => f.type !== 'formula').map(f => f.name));
    const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const lines = [head.map(q).join(',')];
    rows().forEach((s, i) => {
      const line = [i + 1, U.tc(s.in), U.tc(s.out), (s.out - s.in).toFixed(2)]
        .concat(fs.filter(f => f.type !== 'formula').map(f => val(s, f)));
      lines.push(line.map(q).join(','));
    });
    return lines.join('\r\n');
  }
  function exportCSV() {
    if (!LP.state.project.shots.length) return U.toast('还没有片段', 'err');
    U.download(safeName() + '_拉片表.csv', toCSV(), 'text/csv');
    U.toast('已导出 CSV', 'ok');
  }

  /* -------------------------------------------------- R-024 Markdown */
  function toMarkdown() {
    const p = LP.state.project;
    const list = rows();
    const L = [];
    L.push('# ' + p.meta.title + ' · 拉片表');
    L.push('');
    L.push('> 素材：' + (p.videoRef ? p.videoRef.name : '未载入') + '　比例：' + p.videoRatio +
      '　时长：' + U.dur(p.videoRef ? p.videoRef.duration : 0) + '　镜头数：' + list.length);
    L.push('> 导出时间：' + new Date().toLocaleString('zh-CN'));
    L.push('');
    const fs = LP.FIELDS.filter(f => ['select', 'multi', 'text', 'longtext'].indexOf(f.type) >= 0);
    L.push('| # | 入点 | 出点 | 时长 | ' + fs.map(f => f.name).join(' | ') + ' |');
    L.push('|---|---|---|---|' + fs.map(() => '---').join('|') + '|');
    list.forEach((s, i) => {
      L.push('| ' + (i + 1) + ' | ' + U.tc(s.in) + ' | ' + U.tc(s.out) + ' | ' + U.dur(s.out - s.in) + ' | ' +
        fs.map(f => String(val(s, f)).replace(/\n/g, '<br>').replace(/\|/g, '\\|')).join(' | ') + ' |');
    });
    if (p.groups.filter(g => !g.dissolved && LP.state.groupShots(g.id).length).length) {
      L.push(''); L.push('## 段落组分析');
      p.groups.forEach(g => {
        const ms = LP.state.groupShots(g.id);
        if (!ms.length) return;
        L.push('');
        L.push('### ▣ ' + g.name + '（' + ms.length + ' 镜，' + U.tc(Math.min.apply(null, ms.map(s => s.in))) + ' → ' + U.tc(Math.max.apply(null, ms.map(s => s.out))) + '）');
        if (g.analysis) L.push(g.analysis);
        L.push('成员：' + ms.map(s => '#' + shotNo(s)).join(' '));
      });
    }
    return L.join('\n');
  }
  async function copyMarkdown() {
    if (!LP.state.project.shots.length) return U.toast('还没有片段', 'err');
    const ok = await U.copy(toMarkdown());
    U.toast(ok ? 'Markdown 已复制到剪贴板' : '复制失败，请手动选择复制', ok ? 'ok' : 'err');
  }

  /* --------------------------------------------- R-022 素材包 */
  function blocksText(owner, indent) {
    const pre = indent || '';
    return (owner.blocks || []).map(b => {
      const txt = String(b.content || '').replace(/<[^>]+>/g, '').trim();
      if (b.type === 'divider') return pre + '---';
      if (b.type === 'voice') return pre + '（口述转写）' + (b.transcript || txt);
      if (b.type === 'h1') return pre + '## ' + txt;
      if (b.type === 'h2') return pre + '### ' + txt;
      if (b.type === 'list') return pre + '- ' + txt;
      if (b.type === 'todo') return pre + (b.checked ? '- [x] ' : '- [ ] ') + txt;
      if (b.type === 'quote') return pre + '> ' + txt;
      if (b.type === 'callout') return pre + '💡 ' + txt;
      return pre + txt;
    }).filter(x => x.replace(/^[\s>#\-]*/, '')).join('\n');
  }

  function buildPack() {
    const p = LP.state.project;
    const list = LP.state.shots();
    const L = [];
    L.push('# 拉片素材包 · ' + p.meta.title);
    L.push('');
    L.push('## 0. 元信息');
    L.push('- 素材文件：' + (p.videoRef ? p.videoRef.name : '未载入') + '（' + (p.videoRef ? p.videoRef.w + '×' + p.videoRef.h : '') + '，' + p.videoRatio + '）');
    L.push('- 全片时长：' + U.dur(p.videoRef ? p.videoRef.duration : 0));
    L.push('- 已拆镜头：' + list.length + ' 个；段落组：' + p.groups.filter(g => LP.state.groupShots(g.id).length).length + ' 个');
    L.push('- 覆盖率：' + coverage().toFixed(0) + '%（已拆片段时长 / 全片时长）');
    L.push('- 导出时间：' + new Date().toLocaleString('zh-CN'));
    L.push('');
    L.push('## 1. 统计概览');
    const st = stats();
    L.push('- 平均镜头时长：' + st.avg.toFixed(2) + 's；最短 ' + st.min.toFixed(2) + 's；最长 ' + st.max.toFixed(2) + 's');
    L.push('- 景别分布：' + fmtDist(st.size));
    L.push('- 运镜分布：' + fmtDist(st.move));
    L.push('- 声画关系：' + fmtDist(st.soundRel));
    L.push('- 切换方式：' + fmtDist(st.cutType));
    L.push('');
    L.push('## 2. 逐镜记录');
    list.forEach((s, i) => {
      L.push('');
      L.push('### 镜 ' + (i + 1) + '　' + U.tc(s.in) + ' → ' + U.tc(s.out) + '（' + U.dur(s.out - s.in) + '）' +
        (s.groupId && LP.state.group(s.groupId) ? '　[组：' + LP.state.group(s.groupId).name + ']' : ''));
      TEXT_FIELDS().forEach(f => {
        const v = val(s, f);
        if (v) L.push('- **' + f.name + '**：' + String(v).replace(/\n/g, ' '));
      });
      const bt = blocksText(s);
      if (bt) { L.push('- **分析记录**：'); L.push(bt.split('\n').map(x => '  ' + x).join('\n')); }
    });
    const grps = p.groups.filter(g => LP.state.groupShots(g.id).length);
    if (grps.length) {
      L.push(''); L.push('## 3. 段落组（组合分析）');
      grps.forEach(g => {
        const ms = LP.state.groupShots(g.id);
        L.push('');
        L.push('### ▣ ' + g.name + '（镜 ' + ms.map(s => LP.state.shots().indexOf(s) + 1).join('、') + '）');
        if (g.analysis) L.push(g.analysis);
        const bt = blocksText(g);
        if (bt) L.push(bt);
      });
    }
    L.push('');
    L.push('## 4. 请 AI 做的事');
    L.push('请基于以上逐镜记录，输出一份**声画技术拉片报告**（导演视角，不做剧情复述），包含：');
    L.push('1. **镜头语言总览**：景别与运镜的使用规律、这部片子的"视觉语法"是什么；');
    L.push('2. **声音设计**：同期声/音乐/静默的分工，声画同步与对位出现在哪些关键点；');
    L.push('3. **人物塑造手法**：镜头怎样让观众靠近或远离人物（具体到镜号）；');
    L.push('4. **节奏与情绪曲线**：用镜头时长序列说明节奏变化，指出情绪峰值所在段落；');
    L.push('5. **可复制清单（5–8 条）**：我在自己的人物访谈片里可以直接照做的具体做法，每条要能落到拍摄或剪辑动作上。');
    L.push('');
    L.push('注意：请引用镜号与时间码来支撑结论，不要泛泛而谈。');
    return L.join('\n');
  }
  function fmtDist(m) {
    const ks = Object.keys(m);
    if (!ks.length) return '（未填）';
    return ks.sort((a, b) => m[b] - m[a]).map(k => k + '×' + m[k]).join('、');
  }
  function coverage() {
    const d = LP.state.project.videoRef?.duration || 0;
    if (!d) return 0;
    const sum = LP.state.project.shots.reduce((a, s) => a + (s.out - s.in), 0);
    return Math.min(100, sum / d * 100);
  }
  function stats() {
    const list = LP.state.shots();
    const durs = list.map(s => s.out - s.in);
    const st = {
      n: list.length,
      avg: durs.length ? durs.reduce((a, b) => a + b, 0) / durs.length : 0,
      min: durs.length ? Math.min.apply(null, durs) : 0,
      max: durs.length ? Math.max.apply(null, durs) : 0,
      size: {}, move: {}, soundRel: {}, cutType: {}, filled: 0
    };
    list.forEach(s => {
      if (s.size) st.size[s.size] = (st.size[s.size] || 0) + 1;
      (s.move || []).forEach(m => st.move[m] = (st.move[m] || 0) + 1);
      if (s.soundRel) st.soundRel[s.soundRel] = (st.soundRel[s.soundRel] || 0) + 1;
      if (s.cutType) st.cutType[s.cutType] = (st.cutType[s.cutType] || 0) + 1;
      const done = TEXT_FIELDS().filter(f => {
        const v = s[f.key]; return Array.isArray(v) ? v.length : (v != null && v !== '');
      }).length;
      if (done >= 4) st.filled++;
    });
    return st;
  }
  function exportPack() {
    if (!LP.state.project.shots.length) return U.toast('还没有片段', 'err');
    U.download(safeName() + '_素材包.md', buildPack(), 'text/markdown');
    U.toast('素材包已导出 · 粘贴到 AI 对话框即可生成报告', 'ok');
  }
  async function copyPack() {
    const ok = await U.copy(buildPack());
    U.toast(ok ? '素材包已复制，粘贴给 AI 即可' : '复制失败', ok ? 'ok' : 'err');
  }

  /* ------------------------------------------- R-025 工程 JSON */
  function exportProject() {
    const p = U.clone(LP.state.project);
    p.__app = 'lapian-studio-v2';
    p.__note = '本文件不含视频本体，只含 in/out 时间码与标注（虚拟片段）。导入后重新选择同一个视频即可恢复。';
    U.download(safeName() + '_工程.json', JSON.stringify(p, null, 2), 'application/json');
    U.toast('工程已导出（不含视频本体）', 'ok');
  }
  function importProjectFile(file) {
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const d = JSON.parse(fr.result);
        if (!d.shots || !d.meta) throw new Error('不是拉片工程文件');
        if (!confirm('导入将覆盖当前工程（当前工程会先自动导出一份备份）。继续？')) return;
        exportProject();
        d.shots.forEach(s => { if (!Array.isArray(s.blocks)) s.blocks = []; });
        LP.state.setProject(d);
        const t = U.$('#projTitle'); if (t) t.value = d.meta.title || '未命名拉片工程';
        LP.media.applyRatioUI(); LP.media.renderMediaCard(!!d.videoRef);
        LP.media.tryRestore();
        U.toast('工程已导入 · 请重新选择同一个视频', 'ok');
      } catch (e) { U.toast('导入失败：' + e.message, 'err'); }
    };
    fr.readAsText(file);
  }
  function safeName() {
    return (LP.state.project.meta.title || '拉片').replace(/[\\/:*?"<>|]/g, '_');
  }

  /* -------------------------------------- R-023 报告页 / AI 三模式 */
  let aiMode = localStorage.getItem('lapian.aiMode') || 'export';

  function renderReport() {
    const box = U.$('#repWrap'); if (!box) return;
    const st = stats();
    const p = LP.state.project;
    box.innerHTML = '';

    /* 概览卡 */
    const c1 = U.el('div', { class: 'card' });
    c1.innerHTML = '<h3>工程概览</h3><div class="sub">' + U.esc(p.meta.title) +
      (p.videoRef ? ' · ' + U.esc(p.videoRef.name) + ' · ' + p.videoRatio : ' · 未载入视频') + '</div>' +
      '<div class="stat-grid">' +
      stat(st.n, '镜头数') + stat(st.avg.toFixed(1) + 's', '平均时长') +
      stat(coverage().toFixed(0) + '%', '拆解覆盖') +
      stat(st.filled + '/' + st.n, '已标注(≥4维)') +
      stat(p.groups.filter(g => LP.state.groupShots(g.id).length).length, '段落组') +
      '</div>' +
      '<div class="prog" title="标注完成度"><i style="width:' + (st.n ? st.filled / st.n * 100 : 0) + '%"></i></div>';
    box.appendChild(c1);

    /* 分布卡 */
    const c2 = U.el('div', { class: 'card' });
    c2.innerHTML = '<h3>镜头语言分布</h3><div class="sub">用来看你这部片子的"视觉语法"偏好</div>' +
      bars('景别', st.size, LP.FIELD_MAP.size.colors) +
      bars('运镜', st.move, null) +
      bars('声画关系', st.soundRel, LP.FIELD_MAP.soundRel.colors);
    box.appendChild(c2);

    /* 节奏卡 */
    const c3 = U.el('div', { class: 'card' });
    c3.innerHTML = '<h3>节奏曲线</h3><div class="sub">每根竖条 = 一个镜头的时长；越矮越快，长条=停顿/凝视</div>';
    c3.appendChild(rhythmSvg());
    box.appendChild(c3);

    /* AI 三模式 */
    const c4 = U.el('div', { class: 'card' });
    c4.innerHTML = '<h3>AI 报告 · 三种模式</h3><div class="sub">默认走隐私路径：不联网、不上传，导出素材包由你自己交给 AI。</div>';
    const modes = [
      {
        k: 'export', t: '③ 导出素材包手动分析', badge: '<span class="badge rec">默认推荐</span>',
        d: '把素材包（Markdown）导出或复制，粘贴到任意 AI 对话框让它出完整报告。质量最高，素材本体不出机——只有你写的文字离开这台电脑，视频从不上传。'
      },
      {
        k: 'local', t: '① 本地 WebLLM', badge: '<span class="badge">全隐私·需下载模型</span>',
        d: '在浏览器里跑小模型（WebGPU）。完全离线，但小模型对影视分析的判断力有限，且首次需下载 GB 级权重。本版预留接口，未内置模型（内置会破坏"单文件、零依赖、不联网"的红线）。'
      },
      {
        k: 'cloud', t: '② 云端 LLM API（自带 key）', badge: '<span class="badge risk">有出机风险</span>',
        d: '你填自己的 API key，把素材包文本发给云端模型。注意：文字记录会离开本机。涉及敏感采访素材时不建议使用。本版仅提供说明，不内置任何请求代码，避免"看起来本地实则联网"。'
      }
    ];
    modes.forEach(m => {
      const d = U.el('div', { class: 'mode' + (aiMode === m.k ? ' on' : ''), 'data-k': m.k });
      d.innerHTML = '<div class="m-t">' + m.t + m.badge + '</div><div class="m-d">' + m.d + '</div>';
      d.onclick = () => { aiMode = m.k; localStorage.setItem('lapian.aiMode', m.k); renderReport(); };
      c4.appendChild(d);
    });
    const btns = U.el('div', { style: 'display:flex;gap:6px;flex-wrap:wrap;margin-top:10px' });
    btns.appendChild(btn('导出素材包 .md', 'accent', exportPack));
    btns.appendChild(btn('复制素材包', '', copyPack));
    btns.appendChild(btn('导出 CSV', '', exportCSV));
    btns.appendChild(btn('复制 Markdown 拉片表', '', copyMarkdown));
    c4.appendChild(btns);
    box.appendChild(c4);

    /* 素材包预览 */
    const c5 = U.el('div', { class: 'card', style: 'grid-column:1/-1' });
    c5.innerHTML = '<h3>素材包预览</h3><div class="sub">这就是要交给 AI 的全部内容（维度 + 文字记录 + 语音转写）。可直接选中复制。</div>';
    const pre = U.el('pre', { class: 'pack', text: LP.state.project.shots.length ? buildPack() : '还没有片段。先导入视频 → 自动切分或手动建片段 → 填维度写记录。' });
    c5.appendChild(pre);
    box.appendChild(c5);
  }
  function stat(v, l) { return '<div class="stat"><div class="sv">' + v + '</div><div class="sl">' + l + '</div></div>'; }
  function btn(text, cls, fn) { const b = U.el('button', { class: 'btn ' + cls, text: text }); b.onclick = fn; return b; }
  function bars(title, map, colors) {
    const ks = Object.keys(map);
    if (!ks.length) return '<div style="margin:8px 0 4px;font-size:12px;color:var(--txt3)">' + title + '：未填写</div>';
    const max = Math.max.apply(null, ks.map(k => map[k]));
    return '<div style="margin:10px 0 4px;font-size:12px;color:var(--txt2)">' + title + '</div><div class="barlist">' +
      ks.sort((a, b) => map[b] - map[a]).map(k =>
        '<div class="barrow"><span class="bl">' + U.esc(k) + '</span><span class="bt"><i class="bf" style="width:' +
        (map[k] / max * 100) + '%;background:' + ((colors && colors[k]) || 'var(--accent2)') + '"></i></span><span class="bn">' + map[k] + '</span></div>'
      ).join('') + '</div>';
  }
  function rhythmSvg() {
    const list = LP.state.shots();
    const W = 600, H = 110;
    const wrap = U.el('div', { style: 'overflow-x:auto' });
    if (!list.length) { wrap.innerHTML = '<div style="color:var(--txt3);font-size:12px">还没有片段</div>'; return wrap; }
    const max = Math.max.apply(null, list.map(s => s.out - s.in));
    const bw = Math.max(3, Math.min(18, W / list.length - 2));
    const totalW = Math.max(W, list.length * (bw + 2) + 10);
    let svg = '<svg width="' + totalW + '" height="' + H + '" style="display:block">';
    list.forEach((s, i) => {
      const d = s.out - s.in;
      const h = Math.max(2, d / max * (H - 22));
      const color = (LP.FIELD_MAP.size.colors || {})[s.size] || '#4a7fa5';
      svg += '<rect x="' + (i * (bw + 2) + 4) + '" y="' + (H - 16 - h) + '" width="' + bw + '" height="' + h +
        '" fill="' + color + '" rx="1"><title>#' + (i + 1) + ' ' + d.toFixed(1) + 's ' + (s.size || '') + '</title></rect>';
    });
    svg += '<line x1="0" y1="' + (H - 15) + '" x2="' + totalW + '" y2="' + (H - 15) + '" stroke="#3a4048"/>';
    svg += '<text x="4" y="' + (H - 3) + '" fill="#6d747e" font-size="10">镜 1</text>';
    svg += '<text x="' + (totalW - 40) + '" y="' + (H - 3) + '" fill="#6d747e" font-size="10">镜 ' + list.length + '</text>';
    svg += '</svg>';
    wrap.innerHTML = svg;
    return wrap;
  }

  function init() {
    U.$('#btnSaveJson').onclick = exportProject;
    U.$('#btnLoadJson').onclick = () => U.$('#jsonInput').click();
    U.$('#jsonInput').onchange = e => { const f = e.target.files[0]; if (f) importProjectFile(f); e.target.value = ''; };
    LP.bus.on('page', p => { if (p === 'report') renderReport(); });
    LP.bus.on('change', () => { if (LP.ui && LP.ui.page === 'report') renderReport(); });
  }

  return {
    init, renderReport, exportCSV, copyMarkdown, exportPack, copyPack, exportProject, importProjectFile,
    buildPack, toMarkdown, toCSV, stats, coverage
  };
})();


/* ==================== 90-help.js ==================== */
/* =========================================================================
 * 拉片台 LaPian Studio — 90 help
 * 小白友好 / 帮助模块
 * 对应需求：
 *   R-026 引导提示卡（看什么 / 怎么写 / 示例话术）
 *   需求表 §5 达芬奇快捷键速查（学习成本兜底）
 *   R-027 术语速查 + 示例镜头库
 *   R-028 AI 初填维度（本地启发式草稿，P6：不调任何云端）
 *   首次使用引导 welcome()
 * 约束：传统 script，无 import/export；无任何网络请求；只用已有 CSS 类与变量。
 * ========================================================================= */
window.LP = window.LP || {};

LP.help = (function () {
  const U = LP.util;
  const el = U.el, $ = U.$, toast = U.toast;

  /* =====================================================================
   * 通用模态：点遮罩空白处或 Esc 关闭
   * ===================================================================== */
  let curMask = null, curKeyFn = null;

  function closeModal() {
    if (!curMask) return;
    curMask.remove();
    curMask = null;
    if (curKeyFn) document.removeEventListener('keydown', curKeyFn, true);
    curKeyFn = null;
  }

  /** modal(标题, 内容节点, 底栏节点) -> {mask, box, bd, close} */
  function modal(title, bodyEl, footEl, onClose) {
    hideHint();
    closeModal();

    const bd = el('div', { class: 'modal-bd' });
    if (bodyEl) bd.appendChild(bodyEl);

    const hd = el('div', { class: 'modal-hd' }, [
      el('h3', { text: title }),
      el('span', { class: 'grow' }),
      el('button', { class: 'btn ghost', title: '关闭（Esc）', text: '✕', onclick: done })
    ]);

    const box = el('div', { class: 'modal' }, [hd, bd]);
    if (footEl) {
      const ft = el('div', { class: 'modal-ft' });
      ft.appendChild(footEl);
      box.appendChild(ft);
    }

    const mask = el('div', { class: 'mask' });
    mask.addEventListener('mousedown', function (e) { if (e.target === mask) done(); });
    mask.appendChild(box);
    ($('#modalRoot') || document.body).appendChild(mask);

    curMask = mask;
    curKeyFn = function (e) {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done(); }
    };
    document.addEventListener('keydown', curKeyFn, true);

    function done() {
      closeModal();
      if (onClose) { try { onClose(); } catch (err) { } }
    }
    return { mask: mask, box: box, bd: bd, close: done };
  }

  let hintEl = null, showTimer = null, hideTimer = null, hintOwner = null;

  /* 字段 -> 术语库定位关键词（提示卡里的「查术语」） */
  const FIELD_TERM = {
    size: '景别', sizeNote: '景别',
