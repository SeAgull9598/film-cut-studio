<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拉片台 · 声画技术拉片工作站</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23131417'/%3E%3Crect x='6' y='9' width='9' height='14' rx='2' fill='%233f76ab'/%3E%3Crect x='17' y='9' width='9' height='14' rx='2' fill='%23e08b3a'/%3E%3C/svg%3E">
<meta name="description" content="本地优先的拉片工具：把一部影片拆成可分析、可回放、可导出的镜头单元。所有处理在浏览器内完成，素材不出机。">
<style>
/* =========================================================================
 * 拉片台 · 达芬奇式暗色专业主题（R-007 / P7）
 * ========================================================================= */
:root{
  --bg:#131417; --bg2:#181a1e; --panel:#1e2126; --panel2:#24272d; --panel3:#2b2f36;
  --line:#33383f; --line2:#3f454e;
  --txt:#d7dae0; --txt2:#9aa1ab; --txt3:#6d747e;
  --accent:#e08b3a;          /* 达芬奇橙：选中/播放头 */
  --accent2:#4a9eff;         /* 蓝：片段 */
  --ok:#4f9d8f; --warn:#c49a3f; --danger:#c2504e; --purple:#7a5fa5;
  --clip:#33628f; --clip-hd:#3f76ab; --grp:#6b4f8f;
  --radius:5px; --hd:30px;
  --mono:'SF Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--txt);
  font:13px/1.55 -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#3a4048;border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#4a515b}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
b{font-weight:600}

/* ------------------------------------------------------------ 通用控件 */
.btn{
  background:var(--panel3);border:1px solid var(--line2);color:var(--txt);
  padding:5px 10px;border-radius:var(--radius);cursor:pointer;white-space:nowrap;
  transition:.12s;line-height:1.3;
}
.btn:hover{background:#353a43;border-color:#4d5460}
.btn:active{transform:translateY(1px)}
.btn.on,.btn.accent{background:var(--accent);border-color:var(--accent);color:#1a1206;font-weight:600}
.btn.accent:hover{background:#eb9847}
.btn.danger:hover{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.xs{padding:2px 7px;font-size:11.5px}
.btn.ic{padding:4px 9px;font-family:var(--mono);font-size:11px}
.btn.ic.play{background:var(--accent2);border-color:var(--accent2);color:#06121f;font-weight:700;min-width:44px}
.btn.ic.play:hover{background:#5aa8ff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;border-color:transparent;color:var(--txt2)}
.btn.ghost:hover{background:var(--panel3);color:var(--txt)}
.grow{flex:1}
.spacer{flex:1}
.sep{width:1px;height:16px;background:var(--line2);display:inline-block;margin:0 4px;vertical-align:middle}
input[type=text],input:not([type]),textarea,select,.mini-input{
  background:var(--bg2);border:1px solid var(--line);color:var(--txt);
  padding:5px 8px;border-radius:4px;outline:none;width:100%;user-select:text;
}
input:focus,textarea:focus,select:focus{border-color:var(--accent2);background:#15181d}
textarea{resize:vertical;line-height:1.6}
label.chk{display:inline-flex;align-items:center;gap:4px;color:var(--txt2);font-size:12px;cursor:pointer}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
input[type=range]{width:auto;accent-color:var(--accent);height:16px}

/* ------------------------------------------------------------- 布局 */
body{display:flex;flex-direction:column}
#topbar{
  height:42px;flex:0 0 42px;display:flex;align-items:center;gap:10px;padding:0 10px;
  background:linear-gradient(#22252b,#1a1d22);border-bottom:1px solid #000;
}
.brand{display:flex;align-items:center;gap:6px;font-size:14px;letter-spacing:.5px;flex-shrink:0;white-space:nowrap}
.brand .logo{color:var(--accent);font-size:16px}
.proj-title{width:200px;background:transparent;border:1px solid transparent;font-size:12.5px;color:var(--txt2)}
.proj-title:hover{border-color:var(--line)}
.proj-title:focus{color:var(--txt)}
.tb-group{display:flex;gap:5px}
.privacy{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--txt3);
  border:1px solid var(--line);border-radius:20px;padding:3px 10px}
.privacy .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok)}
.save-dot{width:6px;height:6px;border-radius:50%;background:#454b54;transition:.3s}
.save-dot.on{background:var(--accent2);box-shadow:0 0 6px var(--accent2)}

.page{flex:1;min-height:0;display:none;flex-direction:column}
.page:not([hidden]){display:flex}
.cut-grid{
  flex:1;min-height:0;display:grid;gap:4px;padding:4px 4px 0;
  grid-template-columns:240px minmax(320px,1fr) 340px;
}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.panel-hd{
  height:var(--hd);flex:0 0 var(--hd);display:flex;align-items:center;gap:8px;padding:0 9px;
  background:linear-gradient(#262a30,#20232828);border-bottom:1px solid var(--line);
  font-size:12px;color:var(--txt2);font-weight:600;letter-spacing:.3px;
}
.panel-hd .hd-sub{font-weight:400;color:var(--txt3);font-size:11.5px}

/* ------------------------------------------------------------- 媒体池 */
.pool-media{padding:8px}
.drop{border:1.5px dashed var(--line2);border-radius:6px;padding:16px 10px;text-align:center;
  cursor:pointer;transition:.15s;background:#1a1d22}
.drop:hover,.drop.over{border-color:var(--accent);background:#221d16}
.drop-ic{font-size:20px;color:var(--txt3)}
.drop-t{font-size:12.5px;margin-top:4px}
.drop-s{font-size:11px;color:var(--txt3);margin-top:2px}
.media-card{background:#1a1d22;border:1px solid var(--line);border-radius:5px;padding:7px 8px;font-size:11.5px}
.media-card .mc-name{color:var(--txt);word-break:break-all;font-weight:600;margin-bottom:3px}
.media-card .mc-row{color:var(--txt3);display:flex;justify-content:space-between}
.pool-tools{display:flex;gap:5px;padding:0 8px 7px}
.pool-tools .mini-input{font-size:11.5px;padding:3px 6px}
.pool-list{flex:1;overflow:auto;padding:0 6px 8px}
.pool-item{display:flex;gap:7px;align-items:center;padding:5px 6px;border-radius:4px;cursor:pointer;
  border:1px solid transparent}
.pool-item:hover{background:var(--panel2)}
.pool-item.sel{background:#2d2517;border-color:var(--accent)}
.pool-thumb{width:44px;height:26px;flex:0 0 44px;background:#000;border-radius:3px;object-fit:cover;
  border:1px solid var(--line);display:block}
.pool-thumb.vert{width:16px;flex-basis:16px}
.pool-meta{min-width:0;flex:1}
.pool-idx{font-family:var(--mono);color:var(--txt3);font-size:10.5px}
.pool-name{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pool-tc{font-family:var(--mono);font-size:10px;color:var(--txt3)}

/* ------------------------------------------------------------- 检视器 */
.stage{flex:1;min-height:0;background:#000;display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden}
#video{max-width:100%;max-height:100%;width:auto;height:auto;display:none;background:#000}
#video.on{display:block}
.stage-empty{color:var(--txt3);text-align:center;font-size:12.5px;line-height:1.9}
.stage-badge{position:absolute;top:8px;left:8px;background:rgba(224,139,58,.9);color:#1a1206;
  font-size:11px;padding:2px 8px;border-radius:3px;font-weight:600}
.transport{flex:0 0 auto;border-top:1px solid var(--line);background:var(--panel2);padding:6px 8px;
  display:flex;flex-direction:column;gap:6px}
.tc-box{display:flex;align-items:baseline;gap:8px;justify-content:center}
.tc{font-family:var(--mono);font-size:17px;color:var(--accent);letter-spacing:1px;font-weight:600}
.tc-sub{font-family:var(--mono);font-size:11px;color:var(--txt3)}
.tp-btns{display:flex;gap:4px;justify-content:center;align-items:center;flex-wrap:wrap}
.rate{font-family:var(--mono);font-size:11px;color:var(--warn);min-width:34px}
.tp-io{display:flex;gap:5px;align-items:center;justify-content:center;flex-wrap:wrap}
.io-val{font-family:var(--mono);font-size:11px;color:var(--txt2);min-width:150px;text-align:center}
.ratio-tag{font-size:10.5px;border:1px solid var(--line2);border-radius:3px;padding:0 5px;color:var(--txt2)}

/* ------------------------------------------------------------- 时间线 */
.tl-wrap{flex:0 0 210px;margin:4px;min-height:120px}
.tl-hd .tl-tools{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.zoom{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--txt3)}
.tl-scroll{flex:1;overflow:auto;position:relative;background:#15171b}
.tl-inner{position:relative;height:100%;min-width:100%}
.tl-ruler{height:20px;position:sticky;top:0;z-index:5;background:#1b1e23;border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:9.5px;color:var(--txt3)}
.tl-ruler .tick{position:absolute;top:0;height:100%;border-left:1px solid #2e333a;padding-left:3px;
  line-height:20px;white-space:nowrap}
.tl-ruler .tick.major{border-left-color:#454c56;color:var(--txt2)}
.tl-track{position:relative;margin-top:4px}
.tl-groups{height:22px}
.tl-shots{height:56px}
.tl-clip{
  position:absolute;top:0;height:100%;background:linear-gradient(var(--clip-hd),var(--clip));
  border:1px solid #24476b;border-radius:3px;overflow:hidden;cursor:pointer;color:#eaf2fb;
  font-size:10.5px;display:flex;flex-direction:column;box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
}
.tl-clip:hover{filter:brightness(1.18)}
.tl-clip.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),inset 0 1px 0 rgba(255,255,255,.2);z-index:3}
.tl-clip.playing{border-color:#fff}
.tl-clip .c-hd{padding:1px 4px;font-family:var(--mono);font-size:9.5px;background:rgba(0,0,0,.28);
  white-space:nowrap;overflow:hidden}
.tl-clip .c-body{flex:1;padding:1px 4px;overflow:hidden;line-height:1.35;font-size:10px;opacity:.95}
.tl-clip .c-bar{height:3px;width:100%}
.tl-clip .c-hdl{position:absolute;top:0;bottom:0;width:6px;cursor:ew-resize;z-index:4}
.tl-clip .c-hdl.l{left:0} .tl-clip .c-hdl.r{right:0}
.tl-clip .c-hdl:hover{background:rgba(224,139,58,.55)}
.tl-grp{position:absolute;top:0;height:100%;background:linear-gradient(#7a5fa5,#5d4680);
  border:1px solid #4a3667;border-radius:3px;color:#efe8f8;font-size:10.5px;cursor:pointer;
  display:flex;align-items:center;padding:0 6px;overflow:hidden;white-space:nowrap}
.tl-grp:hover{filter:brightness(1.15)}
.tl-grp.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tl-playhead{position:absolute;top:0;bottom:0;width:1px;background:var(--accent);z-index:8;pointer-events:none}
.tl-snap{position:absolute;top:0;bottom:0;width:2px;background:#ffcf5c;z-index:7;pointer-events:none;box-shadow:0 0 4px rgba(255,207,92,.7)}
.tl-playhead::before{content:'';position:absolute;top:0;left:-5px;border:5px solid transparent;
  border-top-color:var(--accent);border-bottom:none;height:0}
.tl-inout{position:absolute;top:0;height:20px;background:rgba(74,158,255,.25);
  border-left:2px solid var(--accent2);border-right:2px solid var(--accent2);z-index:6;pointer-events:none}
.tl-scroll.blade{cursor:crosshair}

/* ------------------------------------------------------------- 检查器 */
.insp-tabs{display:flex;border-bottom:1px solid var(--line);background:var(--panel2)}
.insp-tabs .tab{flex:1;background:none;border:none;padding:7px;cursor:pointer;color:var(--txt3);
  font-size:12px;border-bottom:2px solid transparent}
.insp-tabs .tab.on{color:var(--accent);border-bottom-color:var(--accent);background:#22252b}
.insp-body{flex:1;overflow:auto;padding:8px}
.insp-empty{color:var(--txt3);text-align:center;padding:30px 12px;font-size:12.5px;line-height:1.9}

.dim-sec{border:1px solid var(--line);border-radius:5px;margin-bottom:7px;background:var(--panel2);overflow:hidden}
.dim-hd{display:flex;align-items:center;gap:6px;padding:5px 8px;cursor:pointer;background:#252930;
  font-size:12px;font-weight:600;color:var(--txt2)}
.dim-hd:hover{background:#2a2e36}
.dim-hd .di{color:var(--accent);width:14px;text-align:center}
.dim-hd .arrow{margin-left:auto;color:var(--txt3);font-size:10px;transition:.15s}
.dim-sec.closed .dim-body{display:none}
.dim-sec.closed .arrow{transform:rotate(-90deg)}
.dim-body{padding:8px}
.field{margin-bottom:9px}
.field:last-child{margin-bottom:0}
.field-lb{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--txt2);margin-bottom:4px}
.field-lb .ftype{font-size:9.5px;color:var(--txt3);border:1px solid var(--line2);padding:0 3px;border-radius:2px}
.hint-btn{width:14px;height:14px;line-height:13px;text-align:center;border-radius:50%;
  border:1px solid var(--line2);color:var(--txt3);font-size:10px;cursor:help;background:none;padding:0}
.hint-btn:hover{border-color:var(--accent);color:var(--accent)}
.opts{display:flex;flex-wrap:wrap;gap:4px}
.opt{border:1px solid var(--line2);background:#1b1e23;color:var(--txt2);border-radius:11px;
  padding:2px 9px;font-size:11.5px;cursor:pointer;transition:.12s}
.opt:hover{border-color:var(--txt3);color:var(--txt)}
.opt.on{color:#10131a;font-weight:600;border-color:transparent}
.chip{display:inline-block;border-radius:10px;padding:1px 7px;font-size:11px;color:#10131a;font-weight:600}
.chip.dim{background:#333940;color:var(--txt2);font-weight:400}

/* 提示卡（R-026） */
.hintcard{position:fixed;z-index:400;max-width:300px;background:#20242b;border:1px solid var(--accent);
  border-radius:6px;padding:9px 11px;font-size:11.5px;line-height:1.65;box-shadow:0 10px 30px rgba(0,0,0,.6);color:var(--txt)}
.hintcard h5{margin:0 0 5px;font-size:12px;color:var(--accent)}
.hintcard .hc-k{color:var(--txt3);margin-right:4px}
.hintcard .hc-demo{margin-top:6px;padding:5px 7px;background:#181b20;border-left:2px solid var(--ok);
  color:var(--txt2);font-style:italic;border-radius:0 3px 3px 0}

/* ------------------------------------------------------------- 块编辑器 */
.blk-tools{display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap}
.blk{position:relative;display:flex;gap:5px;align-items:flex-start;padding:2px 0 2px 16px;border-radius:4px}
.blk:hover{background:#212429}
.blk-handle{position:absolute;left:0;top:4px;color:var(--txt3);cursor:grab;font-size:11px;opacity:0;user-select:none}
.blk:hover .blk-handle{opacity:1}
.blk-c{flex:1;min-width:0;outline:none;padding:3px 5px;border-radius:3px;line-height:1.7;user-select:text;
  white-space:pre-wrap;word-break:break-word;font-size:12.5px}
.blk-c:focus{background:#15181d;box-shadow:inset 0 0 0 1px var(--line2)}
.blk-c:empty::before{content:attr(data-ph);color:var(--txt3)}
.blk-h1 .blk-c{font-size:16px;font-weight:700;color:#fff}
.blk-h2 .blk-c{font-size:14px;font-weight:600;color:#eef1f5}
.blk-quote .blk-c{border-left:3px solid var(--txt3);padding-left:9px;color:var(--txt2);font-style:italic}
.blk-callout{background:#1f2a2b;border:1px solid #2f4b4a;border-radius:5px;padding:6px 8px 6px 16px}
.blk-callout .blk-c{color:#cfe6e2}
.blk-li{display:flex}
.blk-li .bullet{color:var(--accent);margin-right:2px}
.blk-todo input{margin-top:6px}
.blk-divider hr{border:none;border-top:1px solid var(--line2);margin:8px 0;width:100%}
.blk-voice{background:#241f2e;border:1px solid #3b3050;border-radius:5px;padding:6px 8px 6px 16px}
.blk-voice .v-bar{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:11px;color:var(--txt2)}
.blk-voice .rec-dot{width:7px;height:7px;border-radius:50%;background:var(--danger);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.blk-del{opacity:0;background:none;border:none;color:var(--txt3);cursor:pointer;font-size:12px;padding:2px 4px}
.blk:hover .blk-del{opacity:1}
.blk-del:hover{color:var(--danger)}
.slash-menu{position:fixed;z-index:500;background:#22262d;border:1px solid var(--line2);border-radius:6px;
  box-shadow:0 12px 32px rgba(0,0,0,.65);width:210px;max-height:280px;overflow:auto;padding:4px}
.slash-item{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:4px;cursor:pointer;font-size:12px}
.slash-item.on,.slash-item:hover{background:var(--panel3)}
.slash-item .si-ic{width:18px;text-align:center;color:var(--accent)}
.slash-item .si-d{color:var(--txt3);font-size:10.5px}

/* ------------------------------------------------------------- 多维表 */
.tbl-bar{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--panel);
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.view-tabs{display:flex;gap:3px}
.vtab{background:none;border:1px solid transparent;color:var(--txt3);padding:4px 11px;border-radius:4px;cursor:pointer;font-size:12.5px}
.vtab:hover{color:var(--txt);background:var(--panel2)}
.vtab.on{background:var(--panel3);color:var(--accent);border-color:var(--line2)}
.tbl-tools{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.tbl-tools .mini-input{width:auto;font-size:11.5px;padding:3px 6px}
.tbl-body{flex:1;overflow:auto;padding:8px}
table.grid{border-collapse:separate;border-spacing:0;font-size:12px;width:max-content;min-width:100%}
table.grid th,table.grid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:0;vertical-align:top;background:var(--panel)}
table.grid th{position:sticky;top:0;z-index:3;background:#262a30;color:var(--txt2);font-weight:600;
  padding:6px 8px;text-align:left;white-space:nowrap;font-size:11.5px}
table.grid th .th-t{display:flex;align-items:center;gap:4px}
table.grid td .cell{padding:5px 7px;min-height:28px;outline:none;user-select:text;white-space:pre-wrap;word-break:break-word}
table.grid td .cell:focus{background:#15181d;box-shadow:inset 0 0 0 1px var(--accent2)}
table.grid tr.sel td{background:#2a2418}
table.grid tr:hover td{background:#232730}
table.grid tr.sel:hover td{background:#332b1c}
table.grid td.c-idx{position:sticky;left:0;z-index:2;background:#22262c;font-family:var(--mono);
  font-size:10.5px;color:var(--txt3);padding:5px 7px;white-space:nowrap;cursor:pointer}
table.grid th.c-idx{left:0;z-index:4}
table.grid tr.grp-row td{background:#2a2338;font-weight:600;color:#ddd0f0;padding:4px 8px}
.kanban{display:flex;gap:9px;align-items:flex-start;overflow-x:auto;padding-bottom:8px}
.kb-col{flex:0 0 218px;background:var(--panel);border:1px solid var(--line);border-radius:6px;
  max-height:100%;display:flex;flex-direction:column}
.kb-hd{padding:6px 9px;border-bottom:1px solid var(--line);font-size:12px;display:flex;
  justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--panel2);border-radius:6px 6px 0 0}
.kb-list{padding:7px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.kb-card{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:6px 8px;cursor:pointer;font-size:11.5px}
.kb-card:hover{border-color:var(--line2);background:var(--panel3)}
.kb-card.sel{border-color:var(--accent)}
.kb-card .kc-tc{font-family:var(--mono);font-size:10px;color:var(--txt3)}
.gallery{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.gal-card{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:pointer}
.gal-card:hover{border-color:var(--line2)}
.gal-card.sel{border-color:var(--accent)}
.gal-thumb{width:100%;background:#000;display:flex;align-items:center;justify-content:center;color:var(--txt3);font-size:11px}
.gal-thumb img{width:100%;height:100%;object-fit:contain;display:block}

<script>

/* ==================== 00-core.js ==================== */
/* =========================================================================
 * 拉片台 LaPian Studio — 00 core
 * 命名空间 / 工具 / 事件总线 / 字段定义 / 数据模型 / 撤销栈 / 本地持久化
 * 对应需求：R-008(虚拟片段) R-015(字段类型) R-016(七维) R-025(本地保存) P1(本地优先)
 * ========================================================================= */
window.LP = window.LP || {};

/* ---------------------------------------------------------------- util */
LP.util = (function () {
  const pad = (n, l = 2) => String(Math.floor(n)).padStart(l, '0');

  /** 秒 -> HH:MM:SS:FF 时间码 */
  function tc(sec, fps) {
    fps = fps || (LP.state && LP.state.project.meta.fps) || 25;
    if (!isFinite(sec) || sec < 0) sec = 0;
    const f = Math.round((sec - Math.floor(sec)) * fps);
    let s = Math.floor(sec), ff = f;
    if (ff >= fps) { ff = 0; s += 1; }
    return pad(s / 3600) + ':' + pad((s % 3600) / 60) + ':' + pad(s % 60) + ':' + pad(ff);
  }
  /** 秒 -> 0.0s / 1:03.2 人类可读时长 */
  function dur(sec) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    if (sec < 60) return sec.toFixed(1) + 's';
    return Math.floor(sec / 60) + ':' + pad(sec % 60) + '.' + Math.floor((sec % 1) * 10);
  }
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  let _seq = 0;
  const uid = (p) => (p || 'id') + '_' + Date.now().toString(36) + '_' + (_seq++).toString(36);
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.prototype.slice.call((root || document).querySelectorAll(sel));

  function el(tag, attrs, children) {
    const n = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (k === 'class') n.className = attrs[k];
      else if (k === 'html') n.innerHTML = attrs[k];
      else if (k === 'text') n.textContent = attrs[k];
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] != null) n.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(c => n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c));
    return n;
  }
  /** 纯本地下载，不经过任何服务器 */
  function download(filename, content, mime) {
    const blob = content instanceof Blob ? content : new Blob(['\ufeff' + content], { type: (mime || 'text/plain') + ';charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  async function copy(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch (e) {
      const ta = el('textarea', { style: 'position:fixed;left:-9999px' });
      ta.value = text; document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch (_) { }
      ta.remove(); return ok;
    }
  }
  function toast(msg, type) {
    let box = $('#lp-toast');
    if (!box) { box = el('div', { id: 'lp-toast' }); document.body.appendChild(box); }
    const t = el('div', { class: 'toast ' + (type || ''), text: msg });
    box.appendChild(t);
    setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 300); }, 2600);
  }
  return { tc, dur, clamp, uid, clone, esc, $, $$, el, download, copy, toast, pad };
})();

/* ----------------------------------------------------------------- bus */
LP.bus = (function () {
  const map = {};
  return {
    on(ev, fn) { (map[ev] = map[ev] || []).push(fn); return () => LP.bus.off(ev, fn); },
    off(ev, fn) { if (map[ev]) map[ev] = map[ev].filter(f => f !== fn); },
    emit(ev, payload) { (map[ev] || []).forEach(f => { try { f(payload); } catch (e) { console.error('[bus:' + ev + ']', e); } }); }
  };
})();
/* 事件约定：
 *  project:loaded  工程/视频载入完成
 *  change          任何工程数据变更（commit 后）  payload:{label}
 *  selection       选择变化 payload:{shotIds,groupId}
 *  time            播放时间更新 payload:{t}
 *  page            页面切换 payload:'cut'|'table'|'report'
 */

/* -------------------------------------------------------------- FIELDS */
/* R-015 字段类型：select 单选 / multi 多选 / text 单行 / longtext 多行
 *                 attachment 附件(关键帧) / relation 关联(到组) / formula 公式(时长)
 * R-016 声画派七维度 + R-026 每字段"看什么/怎么写"提示卡
 */
LP.FIELDS = [
  {
    key: 'size', name: '景别', dim: 1, type: 'select', width: 88,
    options: ['大远景', '远景', '全景', '中景', '近景', '特写', '大特写'],
    colors: { '大远景': '#3d5a80', '远景': '#4a7fa5', '全景': '#4f9d8f', '中景': '#7a9e4a', '近景': '#c49a3f', '特写': '#d1743c', '大特写': '#c2504e' },
    watch: '人物在画面里占多大？头顶到胸口，还是只剩一只眼睛？',
    write: '先写景别，再写它跟上一镜的关系：远→中→特 是逼近，特→全 是抽离。',
    demo: '「上一镜全景交代环境，这镜切近景，观众被推到他脸前，逃不掉。」'
  },
  {
    key: 'sizeNote', name: '递进关系', dim: 1, type: 'text', width: 160,
    watch: '这一镜比上一镜更近还是更远？递进是连续的还是跳跃的？',
    write: '写"从什么到什么，为了什么"。',
    demo: '「全→中→特三级推进，情绪跟着收紧，到特写时他刚好说不出话。」'
  },
  {
    key: 'move', name: '运镜', dim: 2, type: 'multi', width: 130,
    options: ['固定', '推', '拉', '摇', '移', '跟', '升降', '手持', '变焦', '环绕'],

/* --------------------------------------------------------------- state */
LP.state = (function () {
  let project = LP.model.emptyProject();
  let selection = { shotIds: [], groupId: null };
  const undoStack = [], redoStack = [];
  const MAX_UNDO = 60;

  function snapshot() { return JSON.stringify({ shots: project.shots, groups: project.groups, meta: project.meta }); }
  function restore(json) {
    const d = JSON.parse(json);
    project.shots = d.shots; project.groups = d.groups; project.meta = d.meta;
  }

  const api = {
    get project() { return project; },
    get selection() { return selection; },

    /** 取排好序的片段 */
    shots() { return project.shots.slice().sort((a, b) => a.in - b.in); },
    shot(id) { return project.shots.find(s => s.id === id) || null; },
    group(id) { return project.groups.find(g => g.id === id) || null; },
    /** 当前主选中片段 */
    current() { return selection.shotIds.length ? api.shot(selection.shotIds[selection.shotIds.length - 1]) : null; },
    currentGroup() { return selection.groupId ? api.group(selection.groupId) : null; },
    groupShots(gid) { return api.shots().filter(s => s.groupId === gid); },

    /** 变更前调用：压入撤销快照 */
    push() { undoStack.push(snapshot()); if (undoStack.length > MAX_UNDO) undoStack.shift(); redoStack.length = 0; },

    /** 变更后调用：落盘 + 广播 */
    commit(label) {
      project.meta.updatedAt = Date.now();
      LP.storage.saveSoon();
      LP.bus.emit('change', { label: label || '' });
    },
    undo() {
      if (!undoStack.length) return LP.util.toast('没有可撤销的操作');
      redoStack.push(snapshot());
      restore(undoStack.pop());
      selection.shotIds = selection.shotIds.filter(id => api.shot(id));
      if (selection.groupId && !api.group(selection.groupId)) selection.groupId = null;
      api.commit('撤销'); LP.bus.emit('selection', selection);
      LP.util.toast('已撤销');
    },
    redo() {
      if (!redoStack.length) return LP.util.toast('没有可重做的操作');
      undoStack.push(snapshot());
      restore(redoStack.pop());
      api.commit('重做'); LP.bus.emit('selection', selection);
      LP.util.toast('已重做');
    },
    select(shotIds, groupId, opts) {
      selection.shotIds = (shotIds || []).slice();
      selection.groupId = groupId || null;
      LP.bus.emit('selection', Object.assign({}, selection, opts || {}));
    },
    setProject(p) {
      project = p; undoStack.length = 0; redoStack.length = 0;
      selection = { shotIds: [], groupId: null };
      LP.bus.emit('project:loaded', project);
      LP.bus.emit('change', { label: 'load' });
    }
  };
  return api;
})();

/* ------------------------------------------------------------- storage
 * P1 本地优先：工程 JSON -> localStorage；视频 Blob -> IndexedDB
 * 全程无任何网络请求
 */
LP.storage = (function () {
  const LS_KEY = 'lapian.project.v2';
  const DB_NAME = 'lapian-db', STORE = 'media';
  let dbp = null, timer = null;

  function db() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      let req;
      try { req = indexedDB.open(DB_NAME, 1); } catch (e) { return rej(e); }
      req.onupgradeneeded = () => { const d = req.result; if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE); };
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    }).catch(e => { console.warn('IndexedDB 不可用，视频将不会被缓存：', e); return null; });
    return dbp;
  }
  async function putBlob(key, blob) {
    const d = await db(); if (!d) return false;
    return new Promise(res => {
      try {
        const tx = d.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put(blob, key);
        tx.oncomplete = () => res(true); tx.onerror = () => res(false);
      } catch (e) { res(false); }
    });
  }
  async function getBlob(key) {
    const d = await db(); if (!d) return null;
    return new Promise(res => {
      try {
        const tx = d.transaction(STORE, 'readonly');
        const r = tx.objectStore(STORE).get(key);
        r.onsuccess = () => res(r.result || null); r.onerror = () => res(null);
      } catch (e) { res(null); }
    });
  }
  async function delBlob(key) {
    const d = await db(); if (!d) return;
    try { const tx = d.transaction(STORE, 'readwrite'); tx.objectStore(STORE).delete(key); } catch (e) { }
  }

  function save() {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(LP.state.project));
      const dot = LP.util.$('#saveDot'); if (dot) { dot.classList.add('on'); setTimeout(() => dot.classList.remove('on'), 700); }
    } catch (e) { console.warn('工程保存失败（可能超出 localStorage 配额）', e); }
  }
  function saveSoon() { clearTimeout(timer); timer = setTimeout(save, 400); }
  function load() {
    try { const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; }
    catch (e) { return null; }
  }
  function clear() { try { localStorage.removeItem(LS_KEY); } catch (e) { } }
  return { save, saveSoon, load, clear, putBlob, getBlob, delBlob };
})();


/* ==================== 10-media.js ==================== */
/* =========================================================================
 * 10 media — 视频导入 / 横竖屏判定 / 抓帧 / 缩略图
 * R-001 本地导入（点击+拖拽，ObjectURL，不上传）
 * R-002 videoWidth/Height 判定 16:9 / 9:16
 * R-025 大视频 Blob 存 IndexedDB，关页重开可恢复
 * ========================================================================= */
LP.media = (function () {
  const U = LP.util;
  let objectUrl = null;
  let video = null;
  let thumbCanvas = null;

  /* R-002 比例判定：≤0.85 竖屏，≥1.7 横屏，其余记原始比例 */
  function judgeRatio(w, h) {
    if (!w || !h) return 'other';
    const r = w / h;
    if (r <= 0.85) return '9:16';
    if (r >= 1.7) return '16:9';
    return 'other';
  }

  function applyRatioUI() {
    const p = LP.state.project;
    const tag = U.$('#ratioTag');
    if (!tag) return;
    const v = p.videoRef;
    if (!v) { tag.textContent = '—'; return; }
    const label = p.videoRatio === '16:9' ? '横屏 16:9' : p.videoRatio === '9:16' ? '竖屏 9:16' : (v.w + '×' + v.h);
    tag.textContent = label;
    document.body.dataset.ratio = p.videoRatio;
  }

  /** 载入一个 URL 到主播放器，返回元数据 */
  function attach(url) {
    return new Promise((resolve, reject) => {
      video = U.$('#video');
      if (objectUrl && objectUrl !== url) { try { URL.revokeObjectURL(objectUrl); } catch (e) { } }
      objectUrl = url;
      video.src = url;
      video.classList.add('on');
      const onMeta = () => {
        video.removeEventListener('loadedmetadata', onMeta);
        U.$('#stageEmpty').hidden = true;
        resolve({ duration: video.duration, w: video.videoWidth, h: video.videoHeight });
      };
      video.addEventListener('loadedmetadata', onMeta);
      video.addEventListener('error', () => reject(new Error('浏览器无法解码该视频（尝试 mp4/H.264 或 webm）')), { once: true });
    });
  }

  /** R-001 导入本地文件：只走内存 ObjectURL，无任何上传 */
  async function importFile(file, opts) {
    if (!file || !/^video\//.test(file.type) && !/\.(mp4|mov|webm|m4v|mkv)$/i.test(file.name)) {
      return U.toast('请选择视频文件', 'err');
    }
    opts = opts || {};
    U.toast('正在载入 ' + file.name + '…');
    const url = URL.createObjectURL(file);
    let meta;
    try { meta = await attach(url); }
    catch (e) { return U.toast(e.message, 'err'); }

    const p = LP.state.project;
    const keepShots = opts.keepShots && p.videoRef && Math.abs((p.videoRef.duration || 0) - meta.duration) < 0.5;
    const idbKey = 'video_' + (file.name || 'v') + '_' + file.size;

    p.videoRef = { name: file.name, size: file.size, type: file.type, duration: meta.duration, w: meta.w, h: meta.h, idbKey };
    p.videoRatio = judgeRatio(meta.w, meta.h);
    if (!keepShots) { p.shots = []; p.groups = []; }
    if (p.meta.title === '未命名拉片工程') {
      p.meta.title = file.name.replace(/\.[^.]+$/, '');
      const t = U.$('#projTitle'); if (t) t.value = p.meta.title;
    }
    LP.state.commit('导入视频');
    LP.bus.emit('project:loaded', p);
    applyRatioUI();
    renderMediaCard();

    /* R-025 缓存到 IndexedDB，关页重开可恢复（失败只警告不阻断） */
    LP.storage.putBlob(idbKey, file).then(ok => {
      if (ok) U.toast('已载入并本地缓存 · 素材不出机', 'ok');
      else U.toast('已载入（本机缓存不可用，重开需重新选片）');
    });
    return true;
  }

  /** 页面重开时尝试从 IndexedDB 恢复视频 */
  async function tryRestore() {
    const p = LP.state.project;
    if (!p.videoRef || !p.videoRef.idbKey) return false;
    const blob = await LP.storage.getBlob(p.videoRef.idbKey);
    if (!blob) {
      setStatus('工程已恢复，但视频需重新选择：' + p.videoRef.name);
      renderMediaCard(true);
      return false;
    }
    try {
      await attach(URL.createObjectURL(blob));
      applyRatioUI(); renderMediaCard();
      U.toast('已从本机缓存恢复：' + p.videoRef.name, 'ok');
      LP.bus.emit('project:loaded', p);
      return true;
    } catch (e) { return false; }
  }

  function renderMediaCard(missing) {
    const box = U.$('#poolMedia'); if (!box) return;
    const v = LP.state.project.videoRef;
    if (!v) return;
    box.innerHTML = '';
    const card = U.el('div', { class: 'media-card' });
    card.innerHTML =
      '<div class="mc-name">' + U.esc(v.name) + (missing ? ' <span class="badge risk">需重选</span>' : '') + '</div>' +
      '<div class="mc-row"><span>' + U.dur(v.duration) + '</span><span>' + v.w + '×' + v.h + '</span></div>' +
      '<div class="mc-row"><span>' + (v.size / 1048576).toFixed(1) + ' MB</span><span>' +
      (LP.state.project.videoRatio === '9:16' ? '竖屏' : LP.state.project.videoRatio === '16:9' ? '横屏' : '自定义') + '</span></div>';
    const btn = U.el('button', { class: 'btn xs', text: missing ? '重新选择视频' : '更换视频', style: 'margin-top:6px;width:100%' });
    btn.onclick = () => { pendingKeep = !!missing; U.$('#fileInput').click(); };
    box.appendChild(card); box.appendChild(btn);
  }
  let pendingKeep = false;

  /** 抓当前帧 -> dataURL（按原比例，最长边 maxW） */
  function grabFrame(maxW) {
    const v = U.$('#video');
    if (!v || !v.videoWidth) return null;
    maxW = maxW || 320;
    if (!thumbCanvas) thumbCanvas = document.createElement('canvas');
    const scale = Math.min(1, maxW / Math.max(v.videoWidth, v.videoHeight));
    thumbCanvas.width = Math.round(v.videoWidth * scale);
    thumbCanvas.height = Math.round(v.videoHeight * scale);
    const ctx = thumbCanvas.getContext('2d');
    try { ctx.drawImage(v, 0, 0, thumbCanvas.width, thumbCanvas.height); }
    catch (e) { return null; }
    try { return thumbCanvas.toDataURL('image/jpeg', 0.72); } catch (e) { return null; }
  }

  /** 给某片段抓关键帧（seek 到 in+0.1 抓，再回到原位） */
  async function captureShotThumb(shot) {
    const v = U.$('#video'); if (!v || !v.src) return null;
    const back = v.currentTime, wasPlaying = !v.paused;
    v.pause();
    await seekTo(v, Math.min(shot.in + 0.08, Math.max(0, shot.out - 0.02)));
    const data = grabFrame(320);
    await seekTo(v, back);
    if (wasPlaying) v.play();
    return data;
  }
  function seekTo(v, t) {
    return new Promise(res => {
      const done = () => { v.removeEventListener('seeked', done); res(); };
      v.addEventListener('seeked', done);
      v.currentTime = t;
      setTimeout(done, 800);
    });
  }
  function setStatus(s) { const el = U.$('#statusBar'); if (el) el.textContent = s; }

  function init() {
    const fi = U.$('#fileInput'), dz = U.$('#dropZone');
    U.$('#btnImport').onclick = () => { pendingKeep = false; fi.click(); };
    fi.onchange = e => { const f = e.target.files[0]; if (f) importFile(f, { keepShots: pendingKeep }); fi.value = ''; };
    if (dz) dz.onclick = () => { pendingKeep = false; fi.click(); };

    /* 全窗口拖拽导入 */
    ['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => {
      if (!e.dataTransfer || Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') < 0) return;
      e.preventDefault(); if (dz) dz.classList.add('over');
    }));
    ['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => {
      if (ev === 'drop') e.preventDefault();
      if (dz && (ev === 'drop' || e.relatedTarget === null)) dz.classList.remove('over');
    }));
    document.addEventListener('drop', e => {
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (!f) return;
      e.preventDefault();
      if (/\.json$/i.test(f.name)) { LP.exporter.importProjectFile(f); return; }
      pendingKeep = false; importFile(f);
    });

    /* 抓帧按钮：写入当前选中片段的附件字段（R-015 attachment） */
    U.$('#btnGrab').onclick = () => {
      const s = LP.state.current();
      const data = grabFrame(320);
      if (!data) return U.toast('抓帧失败：先导入视频', 'err');
      if (!s) return U.toast('请先在时间线选中一个片段', 'err');
      LP.state.push(); s.thumb = data; LP.state.commit('抓帧');
      U.toast('已抓帧 → 片段 ' + LP.timeline.indexOf(s.id), 'ok');
    };
  }

  return { init, importFile, tryRestore, grabFrame, captureShotThumb, judgeRatio, applyRatioUI, renderMediaCard, get url() { return objectUrl; } };
})();


/* ==================== 20-viewer.js ==================== */
/* =========================================================================
 * 20 viewer — 检视器 / 走带控制 / 虚拟片段播放
 * R-009 点色块即播：seek 到 in、播到 out 自动停，可暂停/拖动/循环
 * R-010 时间线按秒映射，横竖屏共用（检视器 letterbox 由 CSS max-width/height 完成）
 * 快捷键行为：Space / J K L / ←→ / Shift+←→ / I O / Shift+I O
 * ========================================================================= */
LP.player = (function () {
  const U = LP.util;
  let v = null;
  let range = null;          // 当前虚拟片段播放区间 {in,out,shotId}
  let queue = null;          // 段落组连播队列 {list:[{in,out}], idx}
  let loop = false;
  let jklRate = 0;           // 0=停, 正=正放档, 负=倒放档
  let revRaf = null, revLast = 0;
  let inPt = null, outPt = null;

  const fps = () => LP.state.project.meta.fps || 25;
  const dur = () => (v && isFinite(v.duration) ? v.duration : (LP.state.project.videoRef?.duration || 0));

  /* ------------------------------------------------------- 基础控制 */
  function seek(t, opts) {
    if (!v || !v.src) return;
    v.currentTime = U.clamp(t, 0, Math.max(0, dur() - 0.001));
    if (!(opts && opts.keepRange)) { /* 手动拖动允许跑出区间：只解除自动停，不清 range 显示 */ }
    tick();
  }
  function time() { return v ? v.currentTime : 0; }
  function play() { if (v && v.src) { stopReverse(); v.play().catch(() => { }); } }
  function pause() { if (v) v.pause(); stopReverse(); }
  function toggle() { if (!v || !v.src) return U.toast('请先导入视频'); (v.paused ? play() : pause()); }

  /* R-009 播放某个虚拟片段：seek 到 in，播到 out 自动停 */
  function playRange(inSec, outSec, opts) {
    if (!v || !v.src) return U.toast('请先导入视频');
    opts = opts || {};
    queue = null;
    range = { in: inSec, out: outSec, shotId: opts.shotId || null };
    U.$('#playingBadge').hidden = false;
    v.currentTime = inSec;
    if (opts.noPlay) { pause(); }
    else play();
    updateBadge();
  }
  /** 段落组虚拟连播：依次 seek 各成员 in/out，不重编码（R-012） */
  function playQueue(list, opts) {
    if (!v || !v.src) return U.toast('请先导入视频');
    if (!list || !list.length) return;
    queue = { list: list.slice(), idx: 0, label: (opts && opts.label) || '段落组' };
    range = null;
    U.$('#playingBadge').hidden = false;
    v.currentTime = queue.list[0].in;
    play(); updateBadge();
  }
  function clearRange() {
    range = null; queue = null;
    const b = U.$('#playingBadge'); if (b) b.hidden = true;
  }
  function updateBadge() {
    const b = U.$('#playingBadge'); if (!b) return;
    if (queue) b.textContent = '段落组连播 ' + (queue.idx + 1) + '/' + queue.list.length + (loop ? ' · 循环' : '');
    else if (range) b.textContent = '片段播放' + (loop ? ' · 循环' : '');
  }

  /* --------------------------------------------------- JKL 走带 */
  function jkl(dir) {
    if (!v || !v.src) return;
    const steps = [1, 2, 4, 8, 16];
    if (dir === 0) { jklRate = 0; pause(); v.playbackRate = 1; renderRate(); return; }
    if (dir > 0) {
      jklRate = jklRate >= 1 ? Math.min(jklRate + 1, steps.length) : 1;
      stopReverse();
      v.playbackRate = steps[jklRate - 1];
      v.play().catch(() => { });
    } else {
      jklRate = jklRate <= -1 ? Math.max(jklRate - 1, -steps.length) : -1;
      v.pause(); v.playbackRate = 1;
      startReverse(steps[-jklRate - 1]);
    }
    renderRate();
  }
  function renderRate() {
    const el = U.$('#rateTag'); if (!el) return;
    const steps = [1, 2, 4, 8, 16];
    el.textContent = jklRate === 0 ? '' : (jklRate > 0 ? steps[jklRate - 1] + '×' : '-' + steps[-jklRate - 1] + '×');
  }
  function startReverse(rate) {
    stopReverse(); revLast = performance.now();
    const step = (now) => {
      const dt = (now - revLast) / 1000; revLast = now;
      v.currentTime = Math.max(0, v.currentTime - dt * rate);
      if (v.currentTime <= 0.001) { jklRate = 0; renderRate(); stopReverse(); return; }
      tick(); revRaf = requestAnimationFrame(step);
    };
    revRaf = requestAnimationFrame(step);
  }
  function stopReverse() { if (revRaf) { cancelAnimationFrame(revRaf); revRaf = null; } }

  function stepFrame(n) {
    if (!v || !v.src) return;
    pause(); jklRate = 0; renderRate();
    v.currentTime = U.clamp(v.currentTime + n / fps(), 0, Math.max(0, dur() - 1 / fps()));
  }
  /** 跳到上/下一个剪辑点（所有片段的 in/out 边界） */
  function jumpCut(dir) {
    const pts = cutPoints();
    if (!pts.length) return;
    const t = time() + dir * 0.001;
    let target = null;
    if (dir > 0) { for (const p of pts) if (p > t + 0.02) { target = p; break; } }
    else { for (let i = pts.length - 1; i >= 0; i--) if (pts[i] < t - 0.02) { target = pts[i]; break; } }
    if (target == null) return U.toast(dir > 0 ? '已是最后一个剪辑点' : '已是第一个剪辑点');
    seek(target);
    const hit = LP.state.shots().find(s => Math.abs(s.in - target) < 0.005);
    if (hit) LP.state.select([hit.id], null, { fromPlayer: true });
  }
  function cutPoints() {
    const set = new Set([0]);
    LP.state.shots().forEach(s => { set.add(+s.in.toFixed(3)); set.add(+s.out.toFixed(3)); });
    return Array.from(set).sort((a, b) => a - b);
  }

  /* ------------------------------------------------------ 入出点 */
  function setIn(t) {
    inPt = t == null ? time() : t;
    if (outPt != null && outPt <= inPt) outPt = null;
    renderIO();
  }
  function setOut(t) {
    outPt = t == null ? time() : t;
    if (inPt != null && inPt >= outPt) inPt = null;
    renderIO();
  }
  function clearIO() { inPt = outPt = null; renderIO(); }
  function getIO() { return { in: inPt, out: outPt }; }
  function renderIO() {
    const el = U.$('#ioVal');
    if (el) el.textContent = (inPt == null ? '—' : U.tc(inPt)) + ' / ' + (outPt == null ? '—' : U.tc(outPt));
    LP.bus.emit('io', { in: inPt, out: outPt });
  }

  /* -------------------------------------------------------- tick */
  function tick() {
    if (!v) return;
    const t = v.currentTime;
    const now = U.$('#tcNow'); if (now) now.textContent = U.tc(t);
    LP.bus.emit('time', { t: t, playing: !v.paused });
  }

  function onTimeUpdate() {
    if (!v) return;
    const t = v.currentTime;
    /* R-009 播到 out 自动停 */
    if (range && t >= range.out - 0.012) {
      if (loop) { v.currentTime = range.in; }
      else { v.pause(); v.currentTime = Math.max(range.in, range.out - 1 / fps()); clearRangeBadgeSoon(); }
    }
    /* R-012 组连播：到本段 out 跳下一段 in */
    if (queue) {
      const cur = queue.list[queue.idx];
      if (cur && t >= cur.out - 0.012) {
        if (queue.idx < queue.list.length - 1) { queue.idx++; v.currentTime = queue.list[queue.idx].in; updateBadge(); }
        else if (loop) { queue.idx = 0; v.currentTime = queue.list[0].in; updateBadge(); }
        else { v.pause(); clearRangeBadgeSoon(); }
      }
    }
    tick();
  }
  let badgeTimer = null;
  function clearRangeBadgeSoon() {
    clearTimeout(badgeTimer);
    badgeTimer = setTimeout(() => { const b = U.$('#playingBadge'); if (b && v.paused) b.hidden = true; }, 900);
  }

  /* -------------------------------------------------------- init */
  function init() {
    v = U.$('#video');
    v.addEventListener('timeupdate', onTimeUpdate);
    v.addEventListener('play', () => { U.$('#btnPlay').textContent = '❚❚'; tick(); rafLoop(); });
    v.addEventListener('pause', () => { U.$('#btnPlay').textContent = '▶'; jklRate = 0; v.playbackRate = 1; renderRate(); tick(); });
    v.addEventListener('loadedmetadata', () => {
      U.$('#tcDur').textContent = '/ ' + U.tc(v.duration);
      U.$('#viewerInfo').textContent = LP.state.project.videoRef ? LP.state.project.videoRef.name : '';
      clearIO(); tick();
    });
    v.addEventListener('click', () => toggle());

    U.$('#btnPlay').onclick = toggle;
    U.$('#btnStepB').onclick = () => stepFrame(-1);
    U.$('#btnStepF').onclick = () => stepFrame(1);
    U.$('#btnJ').onclick = () => jkl(-1);
    U.$('#btnL').onclick = () => jkl(1);
    U.$('#btnPrevCut').onclick = () => jumpCut(-1);
    U.$('#btnNextCut').onclick = () => jumpCut(1);
    U.$('#btnIn').onclick = () => setIn();
    U.$('#btnOut').onclick = () => setOut();
    U.$('#loopChk').onchange = e => { loop = e.target.checked; updateBadge(); };
    U.$('#btnAddShot').onclick = () => LP.edit.addShotFromIO();

    /* 拖动进度：点击时间线由 timeline 处理，这里处理键盘微调后的 UI 同步 */
    LP.bus.on('project:loaded', () => { clearRange(); clearIO(); });
    renderIO(); renderRate();
  }
  /* 播放时用 rAF 提高时间码刷新率（timeupdate 只有 ~4Hz） */
  function rafLoop() {
    if (!v || v.paused) return;
    tick();
    requestAnimationFrame(rafLoop);
  }

  return {
    init, seek, time, play, pause, toggle, playRange, playQueue, clearRange,
    jkl, stepFrame, jumpCut, setIn, setOut, clearIO, getIO, cutPoints,
    get loop() { return loop; },
    set loop(x) { loop = x; const c = U.$('#loopChk'); if (c) c.checked = x; updateBadge(); },
    get range() { return range; },
    duration: dur
  };
})();


/* ==================== 30-timeline.js ==================== */
/* =========================================================================
 * 30 timeline — 时间线（按秒映射，虚拟片段）
 * R-008 虚拟片段：只存 in/out 引用源视频，不重编码
 * R-009 点色块即播
 * R-010 按时间(秒)映射，横竖屏共用同一轴（与分辨率无关）
 * ========================================================================= */
LP.timeline = (function () {
  const U = LP.util;
  let pps = 60;             // px per second
  let tool = 'arrow';       // arrow | blade
  let dragging = null;
  let scrollEl, innerEl, rulerEl, shotsEl, groupsEl, headEl, ioEl, snapEl;

  const duration = () => (LP.state.project.videoRef?.duration) || 60;
  const x2t = (x) => x / pps;
  const t2x = (t) => t * pps;

  function indexOf(shotId) {
    const list = LP.state.shots();
    const i = list.findIndex(s => s.id === shotId);
    return i < 0 ? '-' : (i + 1);
  }

  /* ------------------------------------------------------------ 渲染 */
  function render() {
    if (!innerEl) return;
    const dur = duration();
    const W = Math.max(scrollEl.clientWidth, Math.ceil(t2x(dur)) + 40);
    innerEl.style.width = W + 'px';
    renderRuler(dur, W);
    renderGroups();
    renderShots();
    renderPlayhead(LP.player.time());
    renderIO(LP.player.getIO());
    const info = U.$('#tlInfo');
    if (info) info.textContent = LP.state.project.shots.length + ' 片段 · ' + LP.state.project.groups.length + ' 组';
    const pc = U.$('#poolCount');
    if (pc) pc.textContent = LP.state.project.shots.length + ' 镜';
  }

  function renderRuler(dur, W) {
    /* 自适应刻度：目标 ~80px 一格 */
    const raw = 80 / pps;
    const steps = [0.1, 0.2, 0.5, 1, 2, 5, 10, 15, 30, 60, 120, 300, 600];
    const step = steps.find(s => s >= raw) || 600;
    let html = '';
    for (let t = 0; t <= dur; t += step) {
      const major = Math.abs((t / step) % 5) < 1e-6;
      html += '<div class="tick' + (major ? ' major' : '') + '" style="left:' + t2x(t).toFixed(1) + 'px">' +
        (major || step >= 1 ? fmtTick(t, step) : '') + '</div>';
    }
    rulerEl.innerHTML = html;
    rulerEl.style.width = W + 'px';
  }
  function fmtTick(t, step) {
    if (step < 1) return t.toFixed(1) + 's';
    const m = Math.floor(t / 60), s = Math.floor(t % 60);
    return m + ':' + U.pad(s);
  }

  function renderShots() {
    const frag = document.createDocumentFragment();
    const sel = LP.state.selection.shotIds;
    const shots = LP.state.shots();
    shots.forEach((s, i) => {
      const w = Math.max(2, t2x(s.out - s.in));
      const d = U.el('div', {
        class: 'tl-clip' + (sel.indexOf(s.id) >= 0 ? ' sel' : ''),
        style: 'left:' + t2x(s.in).toFixed(1) + 'px;width:' + w.toFixed(1) + 'px',
        'data-id': s.id, title: '#' + (i + 1) + '  ' + U.tc(s.in) + ' → ' + U.tc(s.out) + '  (' + U.dur(s.out - s.in) + ')\n点击播放该片段'
      });
      const sizeColor = (LP.FIELD_MAP.size.colors || {})[s.size] || null;
      let body = '';
      if (w > 46) {
        const tags = [];
        if (s.size) tags.push(s.size);
        if (s.move && s.move.length) tags.push(s.move.join('·'));
        body = '<div class="c-body">' + U.esc(tags.join(' / ')) + '</div>';
      }
      d.innerHTML = '<div class="c-hd">' + (i + 1) + (w > 70 ? ' · ' + U.dur(s.out - s.in) : '') + '</div>' + body +
        (sizeColor ? '<div class="c-bar" style="background:' + sizeColor + '"></div>' : '');
      if (s.thumb && w > 90) d.style.backgroundImage = 'linear-gradient(rgba(20,30,45,.72),rgba(20,30,45,.86)),url(' + s.thumb + ')',
        d.style.backgroundSize = 'cover', d.style.backgroundPosition = 'center';
      d.appendChild(U.el('div', { class: 'c-hdl l', 'data-edge': 'in' }));
      d.appendChild(U.el('div', { class: 'c-hdl r', 'data-edge': 'out' }));
      frag.appendChild(d);
    });
    shotsEl.innerHTML = ''; shotsEl.appendChild(frag);
  }

  function renderGroups() {
    const frag = document.createDocumentFragment();
    LP.state.project.groups.forEach(g => {
      const ms = LP.state.groupShots(g.id);
      if (!ms.length) return;
      const a = Math.min.apply(null, ms.map(s => s.in));
      const b = Math.max.apply(null, ms.map(s => s.out));
      const d = U.el('div', {
        class: 'tl-grp' + (LP.state.selection.groupId === g.id ? ' sel' : ''),
        style: 'left:' + t2x(a).toFixed(1) + 'px;width:' + Math.max(8, t2x(b - a)).toFixed(1) + 'px',
        'data-gid': g.id,
        title: '段落组：' + g.name + '（' + ms.length + ' 镜）\n点击 = 虚拟顺序连播'
      });
      d.textContent = '▣ ' + g.name + ' (' + ms.length + ')';
      frag.appendChild(d);
    });
    groupsEl.innerHTML = ''; groupsEl.appendChild(frag);
  }

  function renderPlayhead(t) {
    if (!headEl) return;
    headEl.style.left = t2x(t).toFixed(1) + 'px';
  }
  function renderIO(io) {
    if (!ioEl) return;
    if (io.in == null && io.out == null) { ioEl.hidden = true; return; }
    const a = io.in == null ? 0 : io.in, b = io.out == null ? duration() : io.out;
    ioEl.hidden = false;
    ioEl.style.left = t2x(a).toFixed(1) + 'px';
    ioEl.style.width = Math.max(2, t2x(b - a)).toFixed(1) + 'px';
  }
  function scrollToTime(t) {
    const x = t2x(t);
    if (x < scrollEl.scrollLeft + 30 || x > scrollEl.scrollLeft + scrollEl.clientWidth - 30)
      scrollEl.scrollLeft = Math.max(0, x - scrollEl.clientWidth * 0.35);
  }

  /* 吸附：拖动片段边界时，吸到相邻镜头边缘 / 播放头 / 端点，避免留缝或重叠 */
  const SNAP_PX = 7;
  function snapPoints(excludeId) {
    const t = [0, duration()];
    LP.state.shots().forEach(s => { if (s.id !== excludeId) { t.push(s.in, s.out); } });
    const ph = LP.player.time(); if (isFinite(ph) && ph > 0) t.push(ph);
    return t;
  }
  function snapTime(t, excludeId) {
    const th = SNAP_PX / pps;
    let best = t, d0 = th;
    snapPoints(excludeId).forEach(p => { const d = Math.abs(p - t); if (d <= d0) { d0 = d; best = p; } });
    return { t: best, on: best !== t };
  }
  function showSnap(t) { if (snapEl) { snapEl.style.left = t2x(t).toFixed(1) + 'px'; snapEl.hidden = false; } }
  function hideSnap() { if (snapEl) snapEl.hidden = true; }

  /* ------------------------------------------------------- 交互 */
  function onShotsClick(e) {
    const clip = e.target.closest('.tl-clip');
    if (!clip) return;
    const s = LP.state.shot(clip.dataset.id); if (!s) return;

    /* 刀片工具：点哪切哪 */
    if (tool === 'blade') {
      const t = x2t(e.offsetX + clip.offsetLeft);
      LP.edit.splitAt(s, t);
      return;
    }
    if (e.shiftKey) {
      const cur = LP.state.selection.shotIds.slice();
      const i = cur.indexOf(s.id);
      if (i >= 0) cur.splice(i, 1); else cur.push(s.id);
      LP.state.select(cur, null);
      return;
    }
    LP.state.select([s.id], null);
    LP.player.playRange(s.in, s.out, { shotId: s.id });   /* R-009 */
  }

  function onGroupsClick(e) {
    const g = e.target.closest('.tl-grp'); if (!g) return;
    const grp = LP.state.group(g.dataset.gid); if (!grp) return;
    const ms = LP.state.groupShots(grp.id);
    LP.state.select(ms.map(s => s.id), grp.id);
    LP.player.playQueue(ms.map(s => ({ in: s.in, out: s.out })), { label: grp.name });  /* R-012 */
  }

  /* 点击标尺/空白 = 移动播放头 */
  function onScrub(e) {
    if (e.target.closest('.tl-clip') || e.target.closest('.tl-grp')) return;
    const rect = innerEl.getBoundingClientRect();
    const t = U.clamp(x2t(e.clientX - rect.left), 0, duration());
    LP.player.clearRange();
    LP.player.seek(t);
    const move = ev => {
      const tt = U.clamp(x2t(ev.clientX - rect.left), 0, duration());
      LP.player.seek(tt);
    };
    const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); };
    document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
  }

  /* 拖拽片段边缘改 in/out（非破坏性，只改时间码） */
  function onHandleDown(e) {
    const hdl = e.target.closest('.c-hdl'); if (!hdl) return;
    e.stopPropagation(); e.preventDefault();
    const clip = hdl.closest('.tl-clip');
    const s = LP.state.shot(clip.dataset.id); if (!s) return;
    const edge = hdl.dataset.edge;
    const rect = innerEl.getBoundingClientRect();
    LP.state.push();
    dragging = true;
    const move = ev => {
      const raw = U.clamp(x2t(ev.clientX - rect.left), 0, duration());
      const min = 1 / (LP.state.project.meta.fps || 25);
      const sn = snapTime(raw, s.id);
      const t = sn.t;
      if (edge === 'in') s.in = +U.clamp(t, 0, s.out - min).toFixed(3);
      else s.out = +U.clamp(t, s.in + min, duration()).toFixed(3);
      renderShots(); renderGroups();
      if (sn.on) showSnap(t); else hideSnap();
      const st = U.$('#statusBar');
      if (st) st.textContent = '调整边界 ' + U.tc(s.in) + ' → ' + U.tc(s.out) + (sn.on ? ' · 吸附' : '') + '  (' + U.dur(s.out - s.in) + ')';
    };
    const up = () => {
      document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up);
      hideSnap();
      dragging = false; LP.state.commit('调整片段边界');
    };
    document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
  }

  function setTool(t) {
    tool = t;
    U.$('#toolArrow').classList.toggle('on', t === 'arrow');
    U.$('#toolBlade').classList.toggle('on', t === 'blade');
    scrollEl.classList.toggle('blade', t === 'blade');
  }
  function setZoom(z) {
    pps = U.clamp(z, 4, 800);
    const zi = U.$('#tlZoom'); if (zi && +zi.value !== pps) zi.value = pps;
    render();
  }

  /* -------------------------------------------------------- init */
  function init() {
    scrollEl = U.$('#tlScroll'); innerEl = U.$('#tlInner'); rulerEl = U.$('#tlRuler');
    shotsEl = U.$('#tlShots'); groupsEl = U.$('#tlGroups'); headEl = U.$('#tlPlayhead'); ioEl = U.$('#tlInOut');
    snapEl = U.el('div', { class: 'tl-snap' }); snapEl.hidden = true; innerEl.appendChild(snapEl);

    shotsEl.addEventListener('mousedown', onHandleDown);
    shotsEl.addEventListener('click', onShotsClick);
    groupsEl.addEventListener('click', onGroupsClick);
    rulerEl.addEventListener('mousedown', onScrub);
    innerEl.addEventListener('mousedown', e => { if (e.target === innerEl || e.target === shotsEl || e.target === groupsEl) onScrub(e); });

    /* 滚轮缩放（Cmd/Ctrl+滚轮）与横向滚动 */
    scrollEl.addEventListener('wheel', e => {
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        const rect = innerEl.getBoundingClientRect();
        const tAt = x2t(e.clientX - rect.left);
        setZoom(pps * (e.deltaY < 0 ? 1.18 : 0.85));
        scrollEl.scrollLeft = U.clamp(t2x(tAt) - (e.clientX - scrollEl.getBoundingClientRect().left), 0, 1e7);
      } else if (Math.abs(e.deltaX) < Math.abs(e.deltaY)) {
        scrollEl.scrollLeft += e.deltaY;
      }
    }, { passive: false });

    U.$('#tlZoom').oninput = e => setZoom(+e.target.value);
    U.$('#toolArrow').onclick = () => setTool('arrow');
    U.$('#toolBlade').onclick = () => setTool('blade');
    setTool('arrow');

    LP.bus.on('time', d => { renderPlayhead(d.t); if (d.playing) scrollToTime(d.t); });
    LP.bus.on('io', renderIO);
    LP.bus.on('change', () => { if (!dragging) render(); });
    LP.bus.on('selection', () => { if (!dragging) { renderShots(); renderGroups(); } });
    LP.bus.on('project:loaded', () => { fit(); });
    window.addEventListener('resize', () => render());
    render();
  }
  /** 适配整片宽度 */
  function fit() {
    const w = (scrollEl ? scrollEl.clientWidth : 800) - 30;
    setZoom(Math.max(4, w / Math.max(1, duration())));
  }

  return { init, render, indexOf, setZoom, setTool, fit, scrollToTime, get pps() { return pps; }, get tool() { return tool; } };
})();


/* ==================== 40-edit.js ==================== */
/* =========================================================================
 * 40 edit — 拆分 / 合并(编组) / 解散组 / 删除 / 复制粘贴 / 撤销 / 快捷键
 * R-011 拆分非破坏性：拆后两段 in/out 之和等于原段
 * R-012 合并为段落组：非破坏性，点组=虚拟顺序连播
 * R-013 解散组可逆：组合分析保留，可再组
 * 第 5 节 达芬奇快捷键表
 * ========================================================================= */
LP.edit = (function () {
  const U = LP.util;
  let clipboard = null;
  const MINLEN = () => 1 / (LP.state.project.meta.fps || 25);

  /* ------------------------------------------------------ 新建片段 */
  function addShotFromIO() {
    const io = LP.player.getIO();
    const dur = LP.player.duration();
    if (!dur) return U.toast('请先导入视频', 'err');
    let a = io.in, b = io.out;
    if (a == null && b == null) return U.toast('先按 I / O 设入出点', 'err');
    if (a == null) a = 0;
    if (b == null) b = dur;
    if (b - a < MINLEN()) return U.toast('区间太短', 'err');
    LP.state.push();
    const s = LP.model.newShot(a, b);
    LP.state.project.shots.push(s);
    LP.state.commit('新建片段');
    LP.state.select([s.id], null);
    U.toast('已建片段 #' + LP.timeline.indexOf(s.id) + '  ' + U.dur(b - a), 'ok');
    LP.player.clearIO();
    return s;
  }

  /** 把整片按现有切点补满（空隙自动成段） */
  function fillGaps() {
    const dur = LP.player.duration();
    if (!dur) return U.toast('请先导入视频', 'err');
    const shots = LP.state.shots();
    const gaps = [];
    let cursor = 0;
    shots.forEach(s => { if (s.in - cursor > 0.3) gaps.push([cursor, s.in]); cursor = Math.max(cursor, s.out); });
    if (dur - cursor > 0.3) gaps.push([cursor, dur]);
    if (!gaps.length) return U.toast('没有需要补的空隙');
    LP.state.push();
    gaps.forEach(g => LP.state.project.shots.push(LP.model.newShot(g[0], g[1])));
    LP.state.commit('补满空隙');
    U.toast('已补 ' + gaps.length + ' 个片段', 'ok');
  }

  /* -------------------------------------------------- R-011 拆分 */
  function splitAt(shot, t) {
    if (!shot) return U.toast('先选中一个片段', 'err');
    const min = MINLEN();
    if (t <= shot.in + min || t >= shot.out - min) return U.toast('切点在片段边缘，拆不动', 'err');
    LP.state.push();
    const right = LP.model.newShot(+t.toFixed(3), shot.out);
    /* 非破坏性：维度标注复制到后半段，块记录留在前半段 */
    LP.FIELDS.forEach(f => {
      if (['select', 'text', 'longtext'].indexOf(f.type) >= 0) right[f.key] = shot[f.key] || '';
      if (f.type === 'multi') right[f.key] = (shot[f.key] || []).slice();
    });
    right.groupId = shot.groupId;
    shot.out = +t.toFixed(3);
    LP.state.project.shots.push(right);
    if (right.groupId) {
      const g = LP.state.group(right.groupId);
      if (g && g.memberShotIds.indexOf(right.id) < 0) g.memberShotIds.push(right.id);
    }
    LP.state.commit('拆分片段');
    LP.state.select([right.id], null);
    U.toast('已拆分 → #' + LP.timeline.indexOf(shot.id) + ' / #' + LP.timeline.indexOf(right.id), 'ok');
  }
  function splitAtPlayhead() {
    const t = LP.player.time();
    let s = LP.state.current();
    if (!s || t <= s.in || t >= s.out) s = LP.state.shots().find(x => t > x.in && t < x.out);
    if (!s) return U.toast('播放头不在任何片段内', 'err');
    splitAt(s, t);
  }

  /* ---------------------------------------- R-012 合并（编组） */
  function groupSelected() {
    const ids = LP.state.selection.shotIds;
    if (ids.length < 2) return U.toast('至少选 2 个相邻片段（Shift 点选）', 'err');
    const shots = LP.state.shots().filter(s => ids.indexOf(s.id) >= 0);
    /* 相邻性校验：按时间排序后不允许中间夹着未选中的片段 */
    const all = LP.state.shots();
    const first = all.indexOf(shots[0]), last = all.indexOf(shots[shots.length - 1]);
    if (last - first + 1 !== shots.length) {
      if (!confirm('选中的片段不完全相邻，仍要编组吗？（组内将按时间顺序连播）')) return;
    }
    if (shots.some(s => s.groupId)) {
      if (!confirm('部分片段已属于其它段落组，继续将把它们移到新组。')) return;
    }
    LP.state.push();
    shots.forEach(s => {
      if (s.groupId) {
        const old = LP.state.group(s.groupId);
        if (old) old.memberShotIds = old.memberShotIds.filter(i => i !== s.id);
      }
    });
    const name = '段落 ' + (LP.state.project.groups.length + 1);
    const g = LP.model.newGroup(name, shots.map(s => s.id));
    shots.forEach(s => { s.groupId = g.id; });
    LP.state.project.groups.push(g);
    /* 清理空组 */
    LP.state.project.groups = LP.state.project.groups.filter(x => x.id === g.id || LP.state.groupShots(x.id).length);
    LP.state.commit('编组');
    LP.state.select(shots.map(s => s.id), g.id);
    U.toast('已编组「' + name + '」' + shots.length + ' 镜 · 点色带可连播', 'ok');
  }

  /* --------------------------------------- R-013 解散组（可逆） */
  function ungroupSelected() {
    let gid = LP.state.selection.groupId;
    if (!gid) {
      const s = LP.state.current();
      gid = s && s.groupId;
    }
    if (!gid) return U.toast('先选中一个段落组', 'err');
    const g = LP.state.group(gid); if (!g) return;
    LP.state.push();
    const members = LP.state.groupShots(gid);
    members.forEach(s => { s.groupId = null; });
    /* 可逆：组对象连同组合分析保留在回收区，可再组 */
    g.memberShotIds = [];
    g.dissolved = true;
    LP.state.commit('解散组');
    LP.state.select(members.map(s => s.id), null);
    U.toast('已解散「' + g.name + '」，组合分析已保留，可再次编组恢复', 'ok');
  }
  /* ----------------------------------- R-011 合并相邻镜头（删除中间切点） */
  /** 把选中的相邻镜头合成一段：保留最左 in + 最右 out，删除中间切点。
   *  与"编组"不同——编组只是打标签、两段仍在；合并是真正把两段并成一段。 */
  function mergeSelected() {
    const all = LP.state.shots();                       // 已按 in 排序
    const ids = LP.state.selection.shotIds.slice();
    if (ids.length < 2) return U.toast('请先选中 2 个以上相邻镜头（Shift 点选）再合并', 'err');
    const sel = all.filter(s => ids.indexOf(s.id) >= 0).sort((a, b) => a.in - b.in);
    if (sel.length < 2) return U.toast('至少选 2 个相邻镜头才能合并', 'err');
    /* 相邻性校验：选中片段在时间线上必须连续，中间不能夹着未选中的镜头 */
    const first = all.indexOf(sel[0]), last = all.indexOf(sel[sel.length - 1]);
    if (last - first + 1 !== sel.length)
      return U.toast('选中的镜头不连续，请只选相邻的一串', 'err');
    LP.state.push();
    const left = sel[0], right = sel[sel.length - 1];
    left.out = +right.out.toFixed(3);                   // 合并 = 最左 in + 最右 out
    const keepGid = left.groupId || right.groupId || null;   // 归属：最左优先，其次最右
    if (keepGid) {
      const g = LP.state.group(keepGid);
      if (g && g.memberShotIds.indexOf(left.id) < 0) g.memberShotIds.push(left.id);
    }
    sel.slice(1).forEach(s => {
      if (s.groupId) { const g = LP.state.group(s.groupId); if (g) g.memberShotIds = g.memberShotIds.filter(id => id !== s.id); }
      LP.state.project.shots = LP.state.project.shots.filter(x => x.id !== s.id);
    });
    left.groupId = keepGid;
    LP.state.commit('合并镜头');
    LP.state.select([left.id], keepGid);
    U.toast('已合并 ' + sel.length + ' 镜 → #' + (all.indexOf(left) + 1) + '（' + U.tc(left.in) + ' → ' + U.tc(left.out) + '）', 'ok');
  }

  /** 把选中片段并入一个已解散/已有的组（恢复用） */
  function regroupInto(gid) {
    const g = LP.state.group(gid); if (!g) return;
    const ids = LP.state.selection.shotIds;
    if (!ids.length) return U.toast('先选中片段', 'err');
    LP.state.push();
    ids.forEach(id => { const s = LP.state.shot(id); if (s) { s.groupId = gid; if (g.memberShotIds.indexOf(id) < 0) g.memberShotIds.push(id); } });
    g.dissolved = false;
    LP.state.commit('恢复编组');
    U.toast('已并入「' + g.name + '」', 'ok');
  }

  /* -------------------------------------------------------- 删除 */
  function deleteSelected() {
    const ids = LP.state.selection.shotIds.slice();
    const gid = LP.state.selection.groupId;
    if (!ids.length && !gid) return U.toast('没有选中的片段', 'err');
    if (ids.length > 1 && !confirm('删除 ' + ids.length + ' 个片段？（可 Cmd/Ctrl+Z 撤销）')) return;
    LP.state.push();
    LP.state.project.shots = LP.state.project.shots.filter(s => ids.indexOf(s.id) < 0);
    LP.state.project.groups.forEach(g => { g.memberShotIds = g.memberShotIds.filter(i => ids.indexOf(i) < 0); });
    LP.state.select([], null);
    LP.state.commit('删除片段');
    U.toast('已删除 ' + ids.length + ' 个片段（可撤销）');
  }

  /* --------------------------------------------------- 复制 / 粘贴 */
  function copySelected() {
    const ss = LP.state.selection.shotIds.map(id => LP.state.shot(id)).filter(Boolean);
    if (!ss.length) return;
    clipboard = U.clone(ss);
    U.toast('已复制 ' + ss.length + ' 个片段的标注');
  }
  /** 粘贴：在播放头处贴入同样时长与标注的片段 */
  function paste() {
    if (!clipboard || !clipboard.length) return U.toast('剪贴板是空的');
    LP.state.push();
    let cursor = LP.player.time();
    const created = [];
    clipboard.forEach(c => {
      const len = c.out - c.in;
      const s = LP.model.newShot(cursor, Math.min(cursor + len, LP.player.duration()));
      LP.FIELDS.forEach(f => {
        if (f.type === 'multi') s[f.key] = (c[f.key] || []).slice();
        else if (['select', 'text', 'longtext'].indexOf(f.type) >= 0) s[f.key] = c[f.key] || '';
      });
      s.thumb = c.thumb || null;
      s.blocks = U.clone(c.blocks || []);
      LP.state.project.shots.push(s); created.push(s.id);
      cursor += len;
    });
    LP.state.commit('粘贴片段');
    LP.state.select(created, null);
    U.toast('已粘贴 ' + created.length + ' 个片段', 'ok');
  }

  /* ------------------------------------------------ 选择辅助 */
  function selectByOffset(delta) {
    const list = LP.state.shots();
    if (!list.length) return;
    const cur = LP.state.current();
    let i = cur ? list.indexOf(cur) : -1;
    i = U.clamp(i + delta, 0, list.length - 1);
    const s = list[i];
    LP.state.select([s.id], null);
    LP.player.playRange(s.in, s.out, { shotId: s.id, noPlay: true });
    LP.timeline.scrollToTime(s.in);
  }

  /* -------------------------------------------- 达芬奇快捷键 */
  function isTyping(e) {
    const t = e.target;
    if (!t) return false;
    if (t.isContentEditable) return true;
    const tag = (t.tagName || '').toLowerCase();
    return tag === 'input' || tag === 'textarea' || tag === 'select';
  }

  function onKey(e) {
    if (isTyping(e)) {
      if (e.key === 'Escape') e.target.blur();
      return;
    }
    const mod = e.metaKey || e.ctrlKey;
    const k = e.key;

    /* 通用 */
    if (mod && (k === 'z' || k === 'Z')) { e.preventDefault(); return e.shiftKey ? LP.state.redo() : LP.state.undo(); }
    if (mod && (k === 'c' || k === 'C')) { e.preventDefault(); return copySelected(); }
    if (mod && (k === 'v' || k === 'V')) { e.preventDefault(); return paste(); }
    if (mod && (k === 'b' || k === 'B')) { e.preventDefault(); return splitAtPlayhead(); }
    if (mod && e.shiftKey && (k === 'g' || k === 'G')) { e.preventDefault(); return ungroupSelected(); }
    if (mod && (k === 's' || k === 'S')) { e.preventDefault(); LP.storage.save(); return U.toast('工程已保存到本机', 'ok'); }
    if (mod) return;   /* 其它带修饰键的交给浏览器 */

    switch (k) {
      case ' ': e.preventDefault(); LP.player.toggle(); break;
      case 'i': case 'I':
        e.preventDefault();
        if (e.shiftKey) { const io = LP.player.getIO(); if (io.in != null) LP.player.seek(io.in); }
        else LP.player.setIn();
        break;
      case 'o': case 'O':
        e.preventDefault();
        if (e.shiftKey) { const io = LP.player.getIO(); if (io.out != null) LP.player.seek(io.out); }
        else LP.player.setOut();
        break;
      case 'j': case 'J': e.preventDefault(); LP.player.jkl(-1); break;
      case 'k': case 'K': e.preventDefault(); LP.player.jkl(0); break;
      case 'l': case 'L': e.preventDefault(); LP.player.jkl(1); break;
      case 'ArrowLeft': e.preventDefault(); e.shiftKey ? LP.player.jumpCut(-1) : LP.player.stepFrame(-1); break;
      case 'ArrowRight': e.preventDefault(); e.shiftKey ? LP.player.jumpCut(1) : LP.player.stepFrame(1); break;
      case 'ArrowUp': e.preventDefault(); selectByOffset(-1); break;
      case 'ArrowDown': e.preventDefault(); selectByOffset(1); break;
      case 'b': case 'B': LP.timeline.setTool('blade'); U.toast('刀片工具：点击片段处切开'); break;
      case 'a': case 'A': LP.timeline.setTool('arrow'); U.toast('选择工具'); break;
      case 'g': case 'G': e.preventDefault(); groupSelected(); break;
    case 'm': case 'M': e.preventDefault(); mergeSelected(); break;
      case 'Delete': case 'Backspace': e.preventDefault(); deleteSelected(); break;
      case 'Enter': {
        const s = LP.state.current();
        if (s) LP.player.playRange(s.in, s.out, { shotId: s.id });
        break;
      }
      case '?': if (LP.help && LP.help.shortcuts) LP.help.shortcuts(); break;
      case 'Escape': LP.player.clearRange(); LP.timeline.setTool('arrow'); break;
      default:
        if (k === '/' && e.shiftKey && LP.help) LP.help.shortcuts();
    }
  }

  function init() {
    document.addEventListener('keydown', onKey);
    U.$('#btnSplit').onclick = splitAtPlayhead;
    U.$('#btnGroup').onclick = groupSelected;
    U.$('#btnUngroup').onclick = ungroupSelected;
    U.$('#btnMerge').onclick = mergeSelected;
    U.$('#btnDelShot').onclick = deleteSelected;
    U.$('#btnFillGaps').onclick = fillGaps;
    U.$('#btnUndo').onclick = () => LP.state.undo();
    U.$('#btnRedo').onclick = () => LP.state.redo();
  }

  return {
    init, addShotFromIO, splitAt, splitAtPlayhead, groupSelected, ungroupSelected, mergeSelected,
    regroupInto, deleteSelected, copySelected, paste, fillGaps, selectByOffset
  };
})();


/* ==================== 45-inspector.js ==================== */
/* =========================================================================
 * 45 inspector — 右侧检查器（七维度标注） + 左侧片段池
 * R-014/015/016 字段类型与七维度（检查器形态）
 * R-021 块记录挂到当前片段/组
 * R-026 每个字段挂"看什么/怎么写"提示卡
 * ========================================================================= */
LP.inspector = (function () {
  const U = LP.util;
  let tab = 'dims';
  let closedDims = {};
  try { closedDims = JSON.parse(localStorage.getItem('lapian.dimClosed') || '{}'); } catch (e) { }

  /* --------------------------------------------------- 字段控件 */
  function fieldEl(owner, f) {
    const wrap = U.el('div', { class: 'field' });
    const lb = U.el('div', { class: 'field-lb' });
    lb.appendChild(U.el('span', { text: f.name }));
    lb.appendChild(U.el('span', { class: 'ftype', text: typeLabel(f.type) }));
    if (f.watch) {
      const q = U.el('button', { class: 'hint-btn', text: '?', type: 'button' });
      lb.appendChild(q);
      if (LP.help && LP.help.attachHint) LP.help.attachHint(q, f);
    }
    wrap.appendChild(lb);

    if (f.type === 'select') wrap.appendChild(selectCtl(owner, f));
    else if (f.type === 'multi') wrap.appendChild(multiCtl(owner, f));
    else if (f.type === 'text') wrap.appendChild(textCtl(owner, f, false));
    else if (f.type === 'longtext') wrap.appendChild(textCtl(owner, f, true));
    else if (f.type === 'attachment') wrap.appendChild(attachCtl(owner, f));
    else if (f.type === 'relation') wrap.appendChild(relationCtl(owner, f));
    else if (f.type === 'formula') wrap.appendChild(formulaCtl(owner, f));
    return wrap;
  }
  function typeLabel(t) {
    return { select: '单选', multi: '多选', text: '文本', longtext: '长文本', attachment: '附件', relation: '关联', formula: '公式' }[t] || t;
  }
  function setVal(owner, key, val, label) {
    LP.state.push();
    owner[key] = val;
    LP.state.commit(label || '编辑维度');
  }
  function selectCtl(owner, f) {
    const box = U.el('div', { class: 'opts' });
    f.options.forEach(op => {
      const on = owner[f.key] === op;
      const b = U.el('button', { class: 'opt' + (on ? ' on' : ''), text: op, type: 'button' });
      if (on && f.colors && f.colors[op]) b.style.background = f.colors[op];
      b.onclick = () => setVal(owner, f.key, on ? '' : op);
      box.appendChild(b);
    });
    return box;
  }
  function multiCtl(owner, f) {
    const cur = owner[f.key] || [];
    const box = U.el('div', { class: 'opts' });
    f.options.forEach(op => {
      const on = cur.indexOf(op) >= 0;
      const b = U.el('button', { class: 'opt' + (on ? ' on' : ''), text: op, type: 'button' });
      if (on) b.style.background = 'var(--accent2)';
      b.onclick = () => {
        const next = on ? cur.filter(x => x !== op) : cur.concat([op]);
        setVal(owner, f.key, next);
      };
      box.appendChild(b);
    });
    return box;
  }
  function textCtl(owner, f, long) {
    const el = long
      ? U.el('textarea', { rows: 3, placeholder: f.write || '' })
      : U.el('input', { type: 'text', placeholder: f.write || '' });
    el.value = owner[f.key] || '';
    let timer = null, pushed = false;
    el.addEventListener('input', () => {
      if (!pushed) { LP.state.push(); pushed = true; }
      owner[f.key] = el.value;
      clearTimeout(timer);
      timer = setTimeout(() => { LP.state.commit('编辑 ' + f.name); pushed = false; }, 500);
    });
    el.addEventListener('blur', () => { clearTimeout(timer); if (pushed) { LP.state.commit('编辑 ' + f.name); pushed = false; } });
    if (long) el.addEventListener('input', () => { el.style.height = 'auto'; el.style.height = Math.min(220, el.scrollHeight + 2) + 'px'; });
    return el;
  }
  function attachCtl(owner, f) {
    const box = U.el('div', {});
    if (owner.thumb) {
      const img = U.el('img', { src: owner.thumb, style: 'max-width:100%;border-radius:4px;border:1px solid var(--line);display:block' });
      box.appendChild(img);
    } else {
      box.appendChild(U.el('div', { class: 'hd-sub', text: '未抓帧（截图只是备注，不是分析本体）', style: 'font-size:11.5px;color:var(--txt3)' }));
    }
    const row = U.el('div', { style: 'display:flex;gap:5px;margin-top:5px' });
    const b1 = U.el('button', { class: 'btn xs', text: '抓当前帧', type: 'button' });
    b1.onclick = () => {
      const d = LP.media.grabFrame(320);
      if (!d) return U.toast('抓帧失败', 'err');
      setVal(owner, 'thumb', d, '抓帧');
    };
    const b2 = U.el('button', { class: 'btn xs', text: '抓片段首帧', type: 'button' });
    b2.onclick = async () => {
      const d = await LP.media.captureShotThumb(owner);
      if (d) setVal(owner, 'thumb', d, '抓帧');
    };
    row.appendChild(b1); row.appendChild(b2);
    if (owner.thumb) {
      const b3 = U.el('button', { class: 'btn xs danger', text: '清除', type: 'button' });
      b3.onclick = () => setVal(owner, 'thumb', null, '清除关键帧');
      row.appendChild(b3);
    }
    box.appendChild(row);
    return box;
  }
  function relationCtl(owner, f) {
    const box = U.el('div', {});
    const g = owner.groupId ? LP.state.group(owner.groupId) : null;
    if (g) {
      const chip = U.el('span', { class: 'chip', text: '▣ ' + g.name, style: 'background:var(--grp);color:#efe8f8;cursor:pointer' });
      chip.onclick = () => { LP.state.select(LP.state.groupShots(g.id).map(s => s.id), g.id); };
      box.appendChild(chip);
      const b = U.el('button', { class: 'btn xs', text: '移出组', type: 'button', style: 'margin-left:6px' });
      b.onclick = () => {
        LP.state.push();
        const gg = LP.state.group(owner.groupId);
        if (gg) gg.memberShotIds = gg.memberShotIds.filter(i => i !== owner.id);
        owner.groupId = null; LP.state.commit('移出组');
      };
      box.appendChild(b);
    } else {
      const sel = U.el('select', {});
      sel.appendChild(U.el('option', { value: '', text: '（未归组）' }));
      LP.state.project.groups.forEach(g2 => sel.appendChild(U.el('option', { value: g2.id, text: g2.name + (g2.dissolved ? '（已解散·可恢复）' : '') })));
      sel.onchange = () => {
        if (!sel.value) return;
        LP.state.push();
        const gg = LP.state.group(sel.value);
        if (gg) { if (gg.memberShotIds.indexOf(owner.id) < 0) gg.memberShotIds.push(owner.id); gg.dissolved = false; }
        owner.groupId = sel.value; LP.state.commit('归入段落组');
      };
      box.appendChild(sel);
      box.appendChild(U.el('div', { class: 'hd-sub', text: '或在时间线 Shift 多选后按 G 编组', style: 'font-size:11px;color:var(--txt3);margin-top:3px' }));
    }
    return box;
  }
  function formulaCtl(owner, f) {
    const v = (owner.out - owner.in);
    return U.el('div', {
      style: 'font-family:var(--mono);color:var(--accent);font-size:13px',
      text: U.dur(v) + '   (' + U.tc(owner.in) + ' → ' + U.tc(owner.out) + ')'
    });
  }

  /* ------------------------------------------------- 渲染检查器 */
  function renderDims() {
    const box = U.$('#inspDims');
    const s = LP.state.current();
    const g = LP.state.currentGroup();
    box.innerHTML = '';

    if (g && !s) return renderGroupPanel(box, g);

    if (!s) {
      box.innerHTML = '<div class="insp-empty">未选中片段<br><small>在时间线点击色块，或按 I / O 设入出点后点「+ 建片段」<br>也可以用「自动切分」一次铺满</small></div>';
      U.$('#inspTitle').textContent = '未选中';
      return;
    }
    U.$('#inspTitle').textContent = '#' + LP.timeline.indexOf(s.id) + '  ' + U.dur(s.out - s.in);

    /* 片段头：时间码 + 播放/循环 */
    const hd = U.el('div', { class: 'dim-sec' });
    const hdb = U.el('div', { class: 'dim-body' });
    hdb.appendChild(U.el('div', {
      style: 'font-family:var(--mono);font-size:12px;color:var(--txt2);margin-bottom:6px',
      text: U.tc(s.in) + '  →  ' + U.tc(s.out)
    }));
    const row = U.el('div', { style: 'display:flex;gap:5px;flex-wrap:wrap' });
    const bp = U.el('button', { class: 'btn xs accent', text: '▶ 播放本镜', type: 'button' });
    bp.onclick = () => LP.player.playRange(s.in, s.out, { shotId: s.id });
    const bl = U.el('button', { class: 'btn xs', text: '↻ 循环', type: 'button' });
    bl.onclick = () => { LP.player.loop = true; LP.player.playRange(s.in, s.out, { shotId: s.id }); };
    const bs = U.el('button', { class: 'btn xs', text: '✂ 播放头拆分', type: 'button' });
    bs.onclick = () => LP.edit.splitAtPlayhead();
    row.appendChild(bp); row.appendChild(bl); row.appendChild(bs);
    hdb.appendChild(row);
    hd.appendChild(hdb);
    box.appendChild(hd);

    /* 七维度分组 */
    LP.DIMS.forEach(d => {
      const fields = LP.FIELDS.filter(f => f.dim === d.dim);
      if (!fields.length) return;
      const sec = U.el('div', { class: 'dim-sec' + (closedDims[d.dim] ? ' closed' : '') });
      const filled = fields.some(f => {
        const v = s[f.key];
        return Array.isArray(v) ? v.length : (v != null && v !== '');
      });
      const head = U.el('div', { class: 'dim-hd' });
      head.innerHTML = '<span class="di">' + d.icon + '</span><span>' + d.name + '</span>' +
